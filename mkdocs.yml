site_name: SnatchArr
site_description: Keeps your *arr libraries complete without hammering your indexers. Gentle, cloud-native, a little naughty.
site_url: https://lusoris.github.io/SnatchArr/
site_author: lusoris
repo_url: https://github.com/lusoris/SnatchArr
repo_name: lusoris/SnatchArr
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Docs CC BY-SA 4.0 · Code EUPL-1.2

theme:
  name: material
  favicon: assets/mark.svg
  logo: assets/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - concepts.md
          - configuration.md
        Features and integrations:
          - connections.md
          - notifications.md
          - sso.md
          - download-clients.md
          - queue-management.md
          - seerr.md
          - prowlarr.md
          - readarr.md
        LLM access:
          - llm/index.md
          - llm/antigravity.md
          - llm/claude-code.md
          - llm/codex.md
          - llm/editors.md
          - llm/gemini-cli.md
          - llm/opencode.md
        Operations and reference:
          - api.md
          - upstream-contracts.md
          - install-compose.md
          - deployment.md
          - metrics.md
          - logs.md
          - roadmap.md
        Architecture decisions:
          - adr/*.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Notifications: notifications.md
  - Single Sign-On: sso.md
  - Connections: connections.md
  - Download clients: download-clients.md
  - Queue management: queue-management.md
  - Seerr: seerr.md
  - Prowlarr: prowlarr.md
  - Readarr (legacy): readarr.md
  - LLM access:
      - Overview: llm/index.md
      - Antigravity: llm/antigravity.md
      - Claude Code: llm/claude-code.md
      - Codex: llm/codex.md
      - Editors: llm/editors.md
      - Gemini CLI: llm/gemini-cli.md
      - OpenCode: llm/opencode.md
  - API: api.md
  - Upstream contracts: upstream-contracts.md
  - Install with Docker Compose: install-compose.md
  - Deployment: deployment.md
  - Metrics: metrics.md
  - Logs: logs.md
  - Roadmap: roadmap.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - "ADR-0001: Go control plane, Rust snatch-worker": adr/0001-go-control-plane-rust-snatch-worker.md
      - "ADR-0002: Lease/pull work distribution": adr/0002-lease-pull-work-distribution.md
      - "ADR-0003: Configarr as instance source": adr/0003-configarr-as-instance-source.md
      - "ADR-0004: No Swaparr, Cleanuparr complementary": adr/0004-no-swaparr-cleanuparr-deferred.md
      - "ADR-0005: Static SPA embedded in the API image": adr/0005-static-spa-embedded-in-api-image.md
      - "ADR-0006: Download-client backpressure": adr/0006-download-client-backpressure.md
      - "ADR-0007: Read-only Cleanuparr link": adr/0007-read-only-cleanuparr-link.md
      - "ADR-0008: Readarr frozen as a legacy target": adr/0008-readarr-frozen-legacy-target.md
      - "ADR-0009: Detect Cleanuparr Seeker": adr/0009-detect-cleanuparr-seeker.md
      - "ADR-0010: Keep the api and worker split": adr/0010-keep-api-worker-split.md
      - "ADR-0011: Product definition": adr/0011-product-definition.md
      - Template: adr/0000-template.md
