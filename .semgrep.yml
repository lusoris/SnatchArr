# Semgrep rules for this repository, run by tools/ci/semgrep_scan.py in the
# digest-pinned Semgrep image (the semgrep job in .github/workflows/security.yml).
#
# Copied from tekmora/discord-bot .semgrep.yml (EUPL-1.2, same author) at commit
# 70642249adc9d99375b707cebe0eb756970905cc, which adapted them from golusoris
# .semgrep.yml at commit 0a7d41a29c1865e883e2c7d4e97038cd9ae98ed4. Each rule has a
# fixture under tools/ci/semgrep/testdata/ named after it: lines marked `ruleid:`
# must be reported and lines marked `ok:` must not. The scan script replays every
# fixture before it scans the tree, so a rule that stops firing fails the job.
#
# Every rule gives zero findings on the tree; a finding is a regression.
rules:
  # ── HISS-02 · an HTTP client carries a timeout ─────────────────────────────
  # A client without Timeout has no deadline of its own, so a request sent
  # without a context deadline can hang on a slow peer. Tests are exempt: they
  # talk to a local httptest server.
  - id: http-client-must-set-timeout
    languages: [go]
    severity: ERROR
    message: >-
      *http.Client must set a Timeout. A client without a deadline can hang
      on a slow peer when a request carries no context deadline.
    paths:
      exclude:
        - "*_test.go"
    patterns:
      - pattern: '&http.Client{...}'
      - pattern-not: '&http.Client{..., Timeout: $T, ...}'

  # ── HISS-02 · no http.DefaultClient ────────────────────────────────────────
  # The package-global client has no timeout and is shared by the whole
  # process; a change to it reaches every caller.
  - id: no-http-default-client
    languages: [go]
    severity: ERROR
    message: >-
      Do not use http.DefaultClient: it has no timeout and is shared by the
      whole process. Build an explicit *http.Client{Timeout: ...}.
    paths:
      exclude:
        - "*_test.go"
    pattern: http.DefaultClient

  # ── HISS-02 · no http.ListenAndServe ───────────────────────────────────────
  # The helpers build an *http.Server with no read, write or idle timeouts, so
  # a slow client can hold a connection open indefinitely.
  - id: no-http-listenandserve
    languages: [go]
    severity: ERROR
    message: >-
      http.ListenAndServe builds a Server with no read, write or idle
      timeouts. Build an explicit *http.Server with timeouts instead.
    paths:
      exclude:
        - "*_test.go"
    pattern-either:
      - pattern: http.ListenAndServe(...)
      - pattern: http.ListenAndServeTLS(...)

  # ── HISS-02 · no sub-second run deadline in tests ──────────────────────────
  # A sub-second deadline over a whole test run flakes under host load; bound
  # the operation under test after the handler holds the request and give the
  # run a backstop of seconds.
  - id: test-subsecond-run-deadline
    languages: [go]
    severity: ERROR
    paths:
      include:
        - "*_test.go"
    message: >-
      a sub-second context deadline derived from t.Context() counts host wall
      time, so it flakes under load whether it spans the run or one call; bound
      the operation under test once the handler holds the request and give the
      context a backstop of seconds.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: context.WithTimeout($T.Context(), $N * time.Millisecond)
              - pattern: context.WithTimeout($T.Context(), time.Millisecond * $N)
          - metavariable-comparison:
              metavariable: $N
              comparison: int($N) < 1000
      - patterns:
          - pattern-either:
              - pattern: context.WithTimeout($T.Context(), $N * time.Microsecond)
              - pattern: context.WithTimeout($T.Context(), time.Microsecond * $N)
          - metavariable-comparison:
              metavariable: $N
              comparison: int($N) < 1000000
      - patterns:
          - pattern-either:
              - pattern: context.WithTimeout($T.Context(), $N * time.Nanosecond)
              - pattern: context.WithTimeout($T.Context(), time.Nanosecond * $N)
          - metavariable-comparison:
              metavariable: $N
              comparison: int($N) < 1000000000
      - patterns:
          - pattern: context.WithTimeout($T.Context(), time.Second / $D)
          - metavariable-comparison:
              metavariable: $D
              comparison: int($D) > 1
      - pattern: context.WithTimeout($T.Context(), time.Millisecond)
      - pattern: context.WithTimeout($T.Context(), time.Microsecond)
      - pattern: context.WithTimeout($T.Context(), time.Nanosecond)

  # ── HISS-02 · no sub-second HTTP client timeout in tests ───────────────────
  # Client.Timeout starts before the handler holds the request: dial latency
  # and scheduling can consume it before the behavior under test is reached.
  - id: test-subsecond-client-timeout
    languages: [go]
    severity: ERROR
    paths:
      include:
        - "*_test.go"
    message: >-
      a client Timeout counts dial and scheduling, so a sub-second one flakes
      under load; start the deadline once the handler holds the request, or
      use >= 1s.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: 'http.Client{..., Timeout: $N * time.Millisecond, ...}'
              - pattern: 'http.Client{..., Timeout: time.Millisecond * $N, ...}'
              - pattern: '($C : *http.Client).Timeout = $N * time.Millisecond'
              - pattern: '($C : *http.Client).Timeout = time.Millisecond * $N'
          - metavariable-comparison:
              metavariable: $N
              comparison: int($N) < 1000
      - patterns:
          - pattern-either:
              - pattern: 'http.Client{..., Timeout: $N * time.Microsecond, ...}'
              - pattern: 'http.Client{..., Timeout: time.Microsecond * $N, ...}'
              - pattern: '($C : *http.Client).Timeout = $N * time.Microsecond'
              - pattern: '($C : *http.Client).Timeout = time.Microsecond * $N'
          - metavariable-comparison:
              metavariable: $N
              comparison: int($N) < 1000000
      - patterns:
          - pattern-either:
              - pattern: 'http.Client{..., Timeout: $N * time.Nanosecond, ...}'
              - pattern: 'http.Client{..., Timeout: time.Nanosecond * $N, ...}'
              - pattern: '($C : *http.Client).Timeout = $N * time.Nanosecond'
              - pattern: '($C : *http.Client).Timeout = time.Nanosecond * $N'
          - metavariable-comparison:
              metavariable: $N
              comparison: int($N) < 1000000000
      - patterns:
          - pattern-either:
              - pattern: 'http.Client{..., Timeout: time.Second / $D, ...}'
              - pattern: '($C : *http.Client).Timeout = time.Second / $D'
          - metavariable-comparison:
              metavariable: $D
              comparison: int($D) > 1
      - pattern: 'http.Client{..., Timeout: time.Millisecond, ...}'
      - pattern: 'http.Client{..., Timeout: time.Microsecond, ...}'
      - pattern: 'http.Client{..., Timeout: time.Nanosecond, ...}'
      - pattern: '($C : *http.Client).Timeout = time.Millisecond'
      - pattern: '($C : *http.Client).Timeout = time.Microsecond'
      - pattern: '($C : *http.Client).Timeout = time.Nanosecond'

  # ── HISS-10 · no io/ioutil ─────────────────────────────────────────────────
  # Deprecated since Go 1.16; its functions moved to io and os.
  - id: no-io-ioutil
    languages: [go]
    severity: ERROR
    message: >-
      io/ioutil is deprecated (Go 1.16). Use the io and os replacements, such
      as io.ReadAll, os.ReadFile and os.MkdirTemp.
    pattern-either:
      - pattern: ioutil.$F(...)
      - pattern: import "io/ioutil"

  # ── HISS-09 · unsafe needs a // SAFETY: proof directly above ───────────────
  # The tree imports unsafe nowhere. Importing it, or reinterpreting memory,
  # is admissible only when the comment block directly above states why it
  # holds; a blank line between proof and code breaks the block. A regex is
  # used because Semgrep's Go parser drops the comments the proof lives in.
  - id: unsafe-requires-safety-proof
    languages: [go]
    severity: ERROR
    message: >-
      Importing unsafe, or using unsafe.Pointer/Slice/String/Add, needs a
      `// SAFETY:` proof in the comment block directly above it that states
      the precondition making it sound. Add the proof or use a safe
      conversion.
    pattern-either:
      - pattern-regex: '(?m)^(?![ \t]*//)[^\n]*\n(?:[ \t]*//(?![ \t]*SAFETY:)[^\n]*\n)*\K[ \t]*(?:import[ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]+|_[ \t]+|\.[ \t]+)?"unsafe"[ \t]*$'
      - pattern-regex: '(?m)^(?![ \t]*//)[^\n]*\n(?:[ \t]*//(?![ \t]*SAFETY:)[^\n]*\n)*\K(?![ \t]*//)[^\n]*\bunsafe\.(?:Pointer|Slice|String|SliceData|StringData|Add)\b'

  # ── HISS-08 · no dynamic code loading ──────────────────────────────────────
  # plugin.Open maps a shared object chosen at run time into the process, and
  # reflect.MakeFunc builds a callee the compiler never saw: neither is in the
  # build graph that the module checksums describe.
  - id: no-dynamic-code-loading
    languages: [go]
    severity: ERROR
    message: >-
      Dynamic code loading is not allowed: plugin.Open maps an
      unattested object into the process and reflect.MakeFunc builds a callee
      no compiler saw. Register the implementation statically.
    pattern-either:
      - pattern: import "plugin"
      - pattern: plugin.Open(...)
      - pattern: reflect.MakeFunc(...)

  # ── HISS-08 · exec names a fixed binary ────────────────────────────────────
  # A shell turns its argument into code, and a command name built with + or
  # fmt.Sprintf picks the executable at run time. The shell names are literals,
  # so a name held in a constant is reported too (Semgrep propagates it). Not
  # decided: a name held in a variable or field, which needs dataflow this rule
  # does not have.
  - id: no-dynamic-exec-command
    languages: [go]
    severity: ERROR
    message: >-
      os/exec must name a fixed binary. A shell interprets its argument as
      code, and a name built with + or fmt.Sprintf picks the executable at
      run time. Name the binary once and pass arguments as a slice.
    paths:
      exclude:
        - "*_test.go"
    patterns:
      - pattern-either:
          - pattern: exec.Command($NAME, ...)
          - pattern: exec.CommandContext($CTX, $NAME, ...)
      - metavariable-pattern:
          metavariable: $NAME
          pattern-either:
            - pattern: $A + $B
            - pattern: fmt.Sprintf(...)
            - pattern: '"sh"'
            - pattern: '"bash"'
            - pattern: '"zsh"'
            - pattern: '"dash"'
            - pattern: '"ash"'
            - pattern: '"ksh"'
            - pattern: '"fish"'
            - pattern: '"env"'
            - pattern: '"cmd"'
            - pattern: '"cmd.exe"'
            - pattern: '"powershell"'
            - pattern: '"powershell.exe"'
            - pattern: '"pwsh"'
            - pattern: '"pwsh.exe"'
            - pattern: '"/bin/sh"'
            - pattern: '"/bin/bash"'
            - pattern: '"/bin/zsh"'
            - pattern: '"/bin/dash"'
            - pattern: '"/bin/ash"'
            - pattern: '"/bin/ksh"'
            - pattern: '"/bin/fish"'
            - pattern: '"/bin/env"'
            - pattern: '"/usr/bin/sh"'
            - pattern: '"/usr/bin/bash"'
            - pattern: '"/usr/bin/zsh"'
            - pattern: '"/usr/bin/dash"'
            - pattern: '"/usr/bin/ash"'
            - pattern: '"/usr/bin/ksh"'
            - pattern: '"/usr/bin/fish"'
            - pattern: '"/usr/bin/env"'
            - pattern: '"/usr/bin/pwsh"'
            - pattern: '"/usr/local/bin/pwsh"'

  # ── HISS-06 · no goroutine per input element ───────────────────────────────
  # A spawn inside a loop over the input starts one goroutine per element, so
  # the caller's data sets the goroutine count. A `go` statement passes when a
  # semaphore send or Acquire comes before it in the same loop; a group's Go
  # (errgroup, sync.WaitGroup) passes when SetLimit was called on the same
  # group or a semaphore send or Acquire comes before it in the same loop.
  # Not decided: a counted loop whose bound is a variable holding len(x).
  - id: no-unbounded-goroutine-in-loop
    languages: [go]
    severity: ERROR
    message: >-
      This starts one goroutine per input element, so the goroutine count
      follows the caller's data. Take a slot before the spawn (a buffered
      semaphore channel or semaphore.Weighted.Acquire), or call SetLimit on
      the group you call Go on.
    paths:
      exclude:
        - "*_test.go"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  for $K, $V := range $XS {
                    ...
                    go $F(...)
                    ...
                  }
              - pattern: |
                  for $V := range $XS {
                    ...
                    go $F(...)
                    ...
                  }
              - pattern: |
                  for range $XS {
                    ...
                    go $F(...)
                    ...
                  }
              - pattern: |
                  for $I := 0; $I < len($XS); $I++ {
                    ...
                    go $F(...)
                    ...
                  }
          - pattern-not: |
              for ... {
                ...
                $SEM <- $TOK
                ...
                go $F(...)
                ...
              }
          - pattern-not: |
              for ... {
                ...
                $SEM.Acquire(...)
                ...
                go $F(...)
                ...
              }
      - patterns:
          - pattern-either:
              - pattern: |
                  for $K, $V := range $XS {
                    ...
                    $G.Go(...)
                    ...
                  }
              - pattern: |
                  for $V := range $XS {
                    ...
                    $G.Go(...)
                    ...
                  }
              - pattern: |
                  for range $XS {
                    ...
                    $G.Go(...)
                    ...
                  }
              - pattern: |
                  for $I := 0; $I < len($XS); $I++ {
                    ...
                    $G.Go(...)
                    ...
                  }
          - pattern-not-inside: |
              $G.SetLimit(...)
              ...
          - pattern-not: |
              for ... {
                ...
                $SEM <- $TOK
                ...
                $G.Go(...)
                ...
              }
          - pattern-not: |
              for ... {
                ...
                $SEM.Acquire(...)
                ...
                $G.Go(...)
                ...
              }

  # ── ADR-0046 · download client write allow-list ─────────────────────────────
  # Only allow-listed download client methods may be called across api/.
  # ADR-0046 Decision 1 narrows ADR-0006's read-only boundary for qBittorrent,
  # NZBGet and SABnzbd priority, queue-order and per-item pause/resume writes.
  # Whole-queue pause/resume, add/delete/remove, force start, and other EditQueue
  # commands remain forbidden. Transmission, Deluge and rTorrent remain observe-only.
  # Reference: docs/adr/0046-download-client-priority-writes.md#class-defence
  - id: dlclient-write-allow-list
    languages: [go]
    severity: ERROR
    message: >-
      Method call on download client is not in the ADR-0046 allow-list. Only
      approved read/setup/probe methods and Decision 1 priority/pause/resume writes
      are permitted. Whole-queue operations, deletion, and unapproved actions are forbidden.
    paths:
      exclude:
        - "*_test.go"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: '($CL : *qbit.Client).$METHOD(...)'
              - pattern: '($CL : qbit.Client).$METHOD(...)'
          - pattern-not: '$CL.Login(...)'
          - pattern-not: '$CL.Version(...)'
          - pattern-not: '$CL.ListTorrents(...)'
          - pattern-not: '$CL.GetPreferences(...)'
          - pattern-not: '$CL.TopPriority(...)'
          - pattern-not: '$CL.BottomPriority(...)'
          - pattern-not: '$CL.IncreasePriority(...)'
          - pattern-not: '$CL.DecreasePriority(...)'
          - pattern-not: '$CL.StopTorrents(...)'
          - pattern-not: '$CL.StartTorrents(...)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *qbit.Client).$METHOD($CTX, $HASHES)'
              - pattern: '($CL : qbit.Client).$METHOD($CTX, $HASHES)'
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(TopPriority|BottomPriority|IncreasePriority|DecreasePriority|StopTorrents|StartTorrents)$
          - pattern-either:
              - pattern: '$CL.$METHOD($CTX, []string{"all"})'
              - pattern: '$CL.$METHOD($CTX, []string{})'
              - pattern: '$CL.$METHOD($CTX, nil)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *qbit.Client).$METHOD'
              - pattern: '($CL : qbit.Client).$METHOD'
          - pattern-not-inside: '$CL.$METHOD(...)'
          - pattern-not: '$CL.Login'
          - pattern-not: '$CL.Version'
          - pattern-not: '$CL.ListTorrents'
          - pattern-not: '$CL.GetPreferences'
          - pattern-not: '$CL.TopPriority'
          - pattern-not: '$CL.BottomPriority'
          - pattern-not: '$CL.IncreasePriority'
          - pattern-not: '$CL.DecreasePriority'
          - pattern-not: '$CL.StopTorrents'
          - pattern-not: '$CL.StartTorrents'
      - patterns:
          - pattern-either:
              - pattern: '(*qbit.Client).$METHOD'
              - pattern: '(qbit.Client).$METHOD'
              - pattern: 'qbit.Client.$METHOD'
          - pattern-not: '(*qbit.Client).Login'
          - pattern-not: '(*qbit.Client).Version'
          - pattern-not: '(*qbit.Client).ListTorrents'
          - pattern-not: '(*qbit.Client).GetPreferences'
          - pattern-not: '(*qbit.Client).TopPriority'
          - pattern-not: '(*qbit.Client).BottomPriority'
          - pattern-not: '(*qbit.Client).IncreasePriority'
          - pattern-not: '(*qbit.Client).DecreasePriority'
          - pattern-not: '(*qbit.Client).StopTorrents'
          - pattern-not: '(*qbit.Client).StartTorrents'
          - pattern-not: '(qbit.Client).Login'
          - pattern-not: '(qbit.Client).Version'
          - pattern-not: '(qbit.Client).ListTorrents'
          - pattern-not: '(qbit.Client).GetPreferences'
          - pattern-not: '(qbit.Client).TopPriority'
          - pattern-not: '(qbit.Client).BottomPriority'
          - pattern-not: '(qbit.Client).IncreasePriority'
          - pattern-not: '(qbit.Client).DecreasePriority'
          - pattern-not: '(qbit.Client).StopTorrents'
          - pattern-not: '(qbit.Client).StartTorrents'
          - pattern-not: 'qbit.Client.Login'
          - pattern-not: 'qbit.Client.Version'
          - pattern-not: 'qbit.Client.ListTorrents'
          - pattern-not: 'qbit.Client.GetPreferences'
          - pattern-not: 'qbit.Client.TopPriority'
          - pattern-not: 'qbit.Client.BottomPriority'
          - pattern-not: 'qbit.Client.IncreasePriority'
          - pattern-not: 'qbit.Client.DecreasePriority'
          - pattern-not: 'qbit.Client.StopTorrents'
          - pattern-not: 'qbit.Client.StartTorrents'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *sabnzbd.Client).$METHOD(...)'
              - pattern: '($CL : sabnzbd.Client).$METHOD(...)'
          - pattern-not: '$CL.GetVersion(...)'
          - pattern-not: '$CL.GetQueue(...)'
          - pattern-not: '$CL.SetPriority(...)'
          - pattern-not: '$CL.PauseItem(...)'
          - pattern-not: '$CL.ResumeItem(...)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *sabnzbd.Client).$METHOD'
              - pattern: '($CL : sabnzbd.Client).$METHOD'
          - pattern-not-inside: '$CL.$METHOD(...)'
          - pattern-not: '$CL.GetVersion'
          - pattern-not: '$CL.GetQueue'
          - pattern-not: '$CL.SetPriority'
          - pattern-not: '$CL.PauseItem'
          - pattern-not: '$CL.ResumeItem'
      - patterns:
          - pattern-either:
              - pattern: '(*sabnzbd.Client).$METHOD'
              - pattern: '(sabnzbd.Client).$METHOD'
              - pattern: 'sabnzbd.Client.$METHOD'
          - pattern-not: '(*sabnzbd.Client).GetVersion'
          - pattern-not: '(*sabnzbd.Client).GetQueue'
          - pattern-not: '(*sabnzbd.Client).SetPriority'
          - pattern-not: '(*sabnzbd.Client).PauseItem'
          - pattern-not: '(*sabnzbd.Client).ResumeItem'
          - pattern-not: '(sabnzbd.Client).GetVersion'
          - pattern-not: '(sabnzbd.Client).GetQueue'
          - pattern-not: '(sabnzbd.Client).SetPriority'
          - pattern-not: '(sabnzbd.Client).PauseItem'
          - pattern-not: '(sabnzbd.Client).ResumeItem'
          - pattern-not: 'sabnzbd.Client.GetVersion'
          - pattern-not: 'sabnzbd.Client.GetQueue'
          - pattern-not: 'sabnzbd.Client.SetPriority'
          - pattern-not: 'sabnzbd.Client.PauseItem'
          - pattern-not: 'sabnzbd.Client.ResumeItem'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *nzbget.Client).$METHOD(...)'
              - pattern: '($CL : nzbget.Client).$METHOD(...)'
          - pattern-not: '$CL.GetVersion(...)'
          - pattern-not: '$CL.GetStatus(...)'
          - pattern-not: '$CL.ListGroups(...)'
          - pattern-not: '$CL.SetPriority(...)'
          - pattern-not: '$CL.EditQueue($CTX, "GroupPause", ...)'
          - pattern-not: '$CL.EditQueue($CTX, "GroupResume", ...)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *nzbget.Client).EditQueue($CTX, $ACTION, $PARAM, $IDS)'
              - pattern: '($CL : nzbget.Client).EditQueue($CTX, $ACTION, $PARAM, $IDS)'
          - metavariable-regex:
              metavariable: $ACTION
              regex: ^("GroupPause"|"GroupResume")$
          - pattern-either:
              - pattern: '$CL.EditQueue($CTX, $ACTION, $PARAM, []int{})'
              - pattern: '$CL.EditQueue($CTX, $ACTION, $PARAM, nil)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *nzbget.Client).$METHOD'
              - pattern: '($CL : nzbget.Client).$METHOD'
          - pattern-not-inside: '$CL.$METHOD(...)'
          - pattern-not: '$CL.GetVersion'
          - pattern-not: '$CL.GetStatus'
          - pattern-not: '$CL.ListGroups'
          - pattern-not: '$CL.SetPriority'
      - patterns:
          - pattern-either:
              - pattern: '(*nzbget.Client).$METHOD'
              - pattern: '(nzbget.Client).$METHOD'
              - pattern: 'nzbget.Client.$METHOD'
          - pattern-not: '(*nzbget.Client).GetVersion'
          - pattern-not: '(*nzbget.Client).GetStatus'
          - pattern-not: '(*nzbget.Client).ListGroups'
          - pattern-not: '(*nzbget.Client).SetPriority'
          - pattern-not: '(nzbget.Client).GetVersion'
          - pattern-not: '(nzbget.Client).GetStatus'
          - pattern-not: '(nzbget.Client).ListGroups'
          - pattern-not: '(nzbget.Client).SetPriority'
          - pattern-not: 'nzbget.Client.GetVersion'
          - pattern-not: 'nzbget.Client.GetStatus'
          - pattern-not: 'nzbget.Client.ListGroups'
          - pattern-not: 'nzbget.Client.SetPriority'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *transmission.Client).$METHOD(...)'
              - pattern: '($CL : transmission.Client).$METHOD(...)'
          - pattern-not: '$CL.GetSession(...)'
          - pattern-not: '$CL.GetTorrents(...)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *deluge.Client).$METHOD(...)'
              - pattern: '($CL : deluge.Client).$METHOD(...)'
          - pattern-not: '$CL.Login(...)'
          - pattern-not: '$CL.Connected(...)'
          - pattern-not: '$CL.GetTorrentsStatus(...)'
          - pattern-not: '$CL.GetVersion(...)'
      - patterns:
          - pattern-either:
              - pattern: '($CL : *rtorrent.Client).$METHOD(...)'
              - pattern: '($CL : rtorrent.Client).$METHOD(...)'
          - pattern-not: '$CL.GetSystemInfo(...)'
          - pattern-not: '$CL.GetTorrents(...)'

  # ── HISS-02 · no unbounded HTTP body read ──────────────────────────────────
  # An upstream (*arr, Prowlarr, LLM) response read whole without a bound lets
  # one oversized reply exhaust memory. Bodies goenvoy buffers internally are
  # capped per client through arrclient.BaseFactory.BaseCapped. The ogen
  # request decoders under api/internal/build are generated and change only
  # through their generator.
  - id: no-unbounded-http-body-read
    languages: [go]
    severity: ERROR
    message: >-
      Bound HTTP body reads with io.LimitReader or http.MaxBytesReader before io.ReadAll.
    paths:
      exclude:
        - "*_test.go"
        - "api/internal/build/**"
    pattern: io.ReadAll($X.Body)
