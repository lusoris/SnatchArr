version: 1
repository:
    owner: lusoris
    name: SnatchArr
    visibility: public
    description: "Snatches missing and cutoff-unmet media across *arr instances while respecting per-instance hourly caps"
    homepage: "https://lusoris.github.io/SnatchArr/"
    topics:
        - arr
        - sonarr
        - radarr
        - lidarr
        - readarr
        - whisparr
        - kubernetes
        - golusoris
        - sveltesentio
adoption:
    # Our devcontainer carries Go + Rust + Node; praetor's generated bundle is Go-only.
    decline:
        - dev-container
profiles:
    - app-service
facets:
    - security:high
    - api:public-contract
    - agent:sandboxed
# Overrides only raise strictness, except the explicit review mode below, which
# permits single-maintainer operation as in cordanaLLM/praetor. Owner-approved 2026-10-09.
# Restore independent review when a second maintainer or a review bot can approve; the
# required count stays so that restoration keeps the minimum.
overrides:
    branch_protection:
        enforce_linear_history: true
        require_signed_commits: true
        required_approving_reviewers: 1
        review_mode: single_maintainer
        dismiss_stale_reviews: true
register:
    sources:
        expected: 13
        sha256:
            sha256:5da19afebf05d639726782f18231ab9d3334e5d4ff427929b323f32db14d1634
        inputs:
            - path: .paperclip/harness.json
              surface: prompts
              kind: message
              format: json
              selector: operating_contract.*
            - path: .paperclip/harness.json
              surface: prompts
              kind: message
              format: json
              selector: invariants.*
exceptions:
    - rule: HISS-11
      path: .github/workflows/release.yml
      reason: "release images attest provenance inside the caller build job (SLSA Build Level 2); Level 3 needs the build moved into an isolated reusable workflow"
      expires: "2027-01-06"
    - rule: HISS-18
      path: .github/workflows/ci.yml
      reason: "every component job needs the changes job, a fan-out praetor has no accepted draft shape for (cordanaLLM/praetor#1108); the web job calls the sveltesentio reusable workflow, whose jobs carry no draft step (golusoris/sveltesentio#279)"
      expires: "2027-01-06"
