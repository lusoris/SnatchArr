{{- $sel := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snatcharr.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snatcharr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (or .Values.worker.autoscaling.enabled (dig "keda" "enabled" false .Values.worker.autoscaling)) }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "snatcharr.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "snatcharr.selectorLabels" $sel | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snatcharr.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Long enough to finish leased runs; the API requeues anything a worker drops.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "snatcharr.workerImage" . }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.httpPort }}
              protocol: TCP
          # /livez fails once the worker has had no successful API call for staleSecs, so a
          # worker that cannot lease or heartbeat restarts instead of idling unseen.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # /readyz also fails until the first successful API call, which a LeaseRun long-poll
          # brings within leaseWaitSecs: the Deployment is Available only once its workers have
          # reached the API with their token.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          env:
            - name: SNATCH_API_GRPC
              value: http://{{ include "snatcharr.apiServiceName" . }}:{{ .Values.api.service.grpcPort }}
            - name: SNATCH_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "snatcharr.secretName" . }}
                  key: worker-token
            - name: SNATCH_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SNATCH_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: SNATCH_HEARTBEAT_SECS
              value: {{ .Values.worker.heartbeatSecs | quote }}
            - name: SNATCH_LEASE_WAIT_SECS
              value: {{ .Values.worker.leaseWaitSecs | quote }}
            - name: SNATCH_ARR_TIMEOUT_SECS
              value: {{ .Values.worker.arrTimeoutSecs | quote }}
            - name: SNATCH_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.worker.httpPort }}"
            - name: SNATCH_STALE_SECS
              value: {{ .Values.worker.staleSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.worker.logFilter | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
