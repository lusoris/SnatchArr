apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snatcharr.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snatcharr.labels" . | nindent 4 }}
data:
  APP_HTTP_ADDR: ":{{ .Values.api.service.port }}"
  APP_GRPC_LISTEN: ":{{ .Values.api.service.grpcPort }}"
  APP_SNATCHARR_PROFILE: prod
  # Planner, Seerr sync and Configarr poll run on one elected replica (pg advisory lock).
  APP_LEADER_ENABLED: "true"
  APP_LEADER_NAME: {{ include "snatcharr.fullname" . | quote }}
  APP_SNATCHARR_SESSION_TTL: {{ .Values.config.sessionTtl | quote }}
  APP_SNATCHARR_SESSION_SECURE: "true"
  APP_HTTP_CSRF_SECURE: "true"
  {{- with .Values.config.publicUrl }}
  APP_SNATCHARR_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  APP_OTEL_ENABLED: {{ .Values.config.otel.enabled | quote }}
  {{- if .Values.config.otel.enabled }}
  APP_OTEL_ENDPOINT: {{ required "config.otel.endpoint is required when OTEL is enabled" .Values.config.otel.endpoint | quote }}
  APP_OTEL_INSECURE: {{ .Values.config.otel.insecure | quote }}
  APP_OTEL_SERVICE_NAME: snatcharr-api
  APP_OTEL_SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  {{- end }}
  {{- if .Values.configarr.enabled }}
  APP_SNATCHARR_CONFIGARR_CONFIG: /etc/snatcharr/configarr/{{ .Values.configarr.configKey }}
  {{- if .Values.configarr.downloadClientsKey }}
  APP_SNATCHARR_CONFIGARR_DOWNLOAD_CLIENTS: /etc/snatcharr/configarr/{{ .Values.configarr.downloadClientsKey }}
  {{- end }}
  {{- if .Values.configarr.existingSecret }}
  APP_SNATCHARR_CONFIGARR_SECRETS: /etc/snatcharr/configarr-secrets/{{ .Values.configarr.secretsKey }}
  {{- end }}
  APP_SNATCHARR_CONFIGARR_WATCH: {{ .Values.configarr.watch | quote }}
  {{- end }}
  {{- if and .Values.auth .Values.auth.oidc .Values.auth.oidc.enabled }}
  APP_SNATCHARR_OIDC_ENABLED: "true"
  APP_SNATCHARR_OIDC_ISSUER_URL: {{ required "auth.oidc.issuerUrl is required when auth.oidc.enabled is true" .Values.auth.oidc.issuerUrl | quote }}
  APP_SNATCHARR_OIDC_CLIENT_ID: {{ required "auth.oidc.clientId is required when auth.oidc.enabled is true" .Values.auth.oidc.clientId | quote }}
  {{- with .Values.auth.oidc.redirectUrl }}
  APP_SNATCHARR_OIDC_REDIRECT_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.scopes }}
  APP_SNATCHARR_OIDC_SCOPES: {{ join "," .Values.auth.oidc.scopes | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.allowedSubjects }}
  APP_SNATCHARR_OIDC_ALLOWED_SUBJECTS: {{ join "," .Values.auth.oidc.allowedSubjects | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.allowedEmails }}
  APP_SNATCHARR_OIDC_ALLOWED_EMAILS: {{ join "," .Values.auth.oidc.allowedEmails | quote }}
  {{- end }}
  {{- with .Values.auth.oidc.discoveryTimeout }}
  APP_SNATCHARR_OIDC_DISCOVERY_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.auth .Values.auth.proxyAuth .Values.auth.proxyAuth.enabled }}
  APP_SNATCHARR_PROXY_AUTH_ENABLED: "true"
  {{- with .Values.auth.proxyAuth.header }}
  APP_SNATCHARR_PROXY_AUTH_HEADER: {{ . | quote }}
  {{- end }}
  {{- if .Values.auth.proxyAuth.trustedCidrs }}
  APP_SNATCHARR_PROXY_AUTH_TRUSTED_CIDRS: {{ join "," .Values.auth.proxyAuth.trustedCidrs | quote }}
  {{- end }}
  {{- if .Values.auth.proxyAuth.allowedUsers }}
  APP_SNATCHARR_PROXY_AUTH_ALLOWED_USERS: {{ join "," .Values.auth.proxyAuth.allowedUsers | quote }}
  {{- end }}
  {{- end }}
