{{- if and .Values.grafana .Values.grafana.dashboards .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snatcharr.fullname" . }}-dashboard
  labels:
    {{- include "snatcharr.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
    {{- with .Values.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  snatcharr.json: |-
{{ .Files.Get "dashboards/snatcharr.json" | indent 4 }}
{{- end }}
