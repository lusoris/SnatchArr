{{- if not .Values.secrets.existingSecret }}
{{- /* Generated values survive upgrades: reuse what the cluster already holds. */ -}}
{{- $name := include "snatcharr.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $existing.data | default dict }}
{{- $crypto := .Values.secrets.cryptoKey | default (get $data "crypto-key" | b64dec) | default (randAlphaNum 32 | sha256sum) }}
{{- $csrf := .Values.secrets.csrfSecret | default (get $data "csrf-secret" | b64dec) }}
{{- /* golusoris httpx/csrf needs 32 bytes as hex or base64. The 0.1.0 chart generated 48
       alphanumerics, which do not decode; such a stored value is replaced (only CSRF tokens
       in flight are lost). A value from secrets.csrfSecret is checked by values.schema.json. */ -}}
{{- if not (regexMatch "^([0-9a-fA-F]{64}|[A-Za-z0-9+/]{43}=|[A-Za-z0-9_-]{43}=)$" $csrf) }}
{{- $csrf = randAlphaNum 32 | sha256sum }}
{{- end }}
{{- $apikey := .Values.secrets.apiKeySecret | default (get $data "apikey-secret" | b64dec) | default (randAlphaNum 48) }}
{{- $worker := .Values.secrets.workerToken | default (get $data "worker-token" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "snatcharr.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret across ArgoCD/Helm re-renders that would otherwise regenerate it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  crypto-key: {{ $crypto | quote }}
  csrf-secret: {{ $csrf | quote }}
  apikey-secret: {{ $apikey | quote }}
  worker-token: {{ $worker | quote }}
{{- else }}
{{- /* An existing Secret is the operator's; refuse a csrf-secret the API would crash on. */ -}}
{{- $ext := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.existingSecret) | default dict }}
{{- $csrf := get ($ext.data | default dict) "csrf-secret" | b64dec }}
{{- if and $csrf (not (regexMatch "^([0-9a-fA-F]{64}|[A-Za-z0-9+/]{43}=|[A-Za-z0-9_-]{43}=)$" $csrf)) }}
{{- fail (printf "secret %s: csrf-secret must be 32 bytes as hex or base64 (openssl rand -hex 32)" .Values.secrets.existingSecret) }}
{{- end }}
{{- end }}
