{{- $sel := dict "root" . "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "snatcharr.apiServiceName" . }}
  labels:
    {{- include "snatcharr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.api.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "snatcharr.selectorLabels" $sel | nindent 4 }}
