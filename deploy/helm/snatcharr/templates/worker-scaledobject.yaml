{{- $as := .Values.worker.autoscaling }}
{{- /* Values reused from chart 0.2.1 or older (helm upgrade --reuse-values) have no keda key. */}}
{{- $keda := $as.keda | default dict }}
{{- if $keda.enabled }}
{{- if $as.enabled }}
{{- fail "worker.autoscaling.enabled and worker.autoscaling.keda.enabled are exclusive: KEDA creates its own HorizontalPodAutoscaler for the worker" }}
{{- end }}
{{- $server := required "worker.autoscaling.keda.serverAddress is required when worker.autoscaling.keda.enabled=true" $keda.serverAddress }}
{{- /* The api leader exports the gauge; max, not sum, so a stale series from a former leader is never added to it. */}}
{{- $query := $keda.query | default (printf "max(snatcharr_runs{status=\"queued\",namespace=\"%s\"})" .Release.Namespace) }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "snatcharr.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snatcharr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "snatcharr.fullname" . }}-worker
  minReplicaCount: {{ $as.minReplicas }}
  maxReplicaCount: {{ $as.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $server | quote }}
        query: {{ $query | quote }}
        # Queued runs per worker replica; defaults to worker.concurrency (runs one replica takes at once).
        threshold: {{ $keda.threshold | default .Values.worker.concurrency | toString | quote }}
{{- end }}
