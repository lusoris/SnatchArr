suite: api deployment and secret setup secret
templates:
  - configmap.yaml
  - secret.yaml
  - api-deployment.yaml
release:
  name: snatcharr
  namespace: snatcharr
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
tests:
  - it: default - generated Secret holds non-empty setup-secret and deployment env non-optional in generated branch
    templates:
      - secret.yaml
      - api-deployment.yaml
    asserts:
      - template: secret.yaml
        isNotNull:
          path: stringData.setup-secret
      - template: secret.yaml
        isNotEmpty:
          path: stringData.setup-secret
      - template: api-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_SNATCHARR_SETUP_SECRET
            valueFrom:
              secretKeyRef:
                name: snatcharr-secrets
                key: setup-secret

  - it: positive - explicit secrets.setupSecret used
    set:
      secrets:
        setupSecret: "my-bootstrap-secret"
    templates:
      - secret.yaml
      - api-deployment.yaml
    asserts:
      - template: secret.yaml
        equal:
          path: stringData.setup-secret
          value: "my-bootstrap-secret"
      - template: api-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_SNATCHARR_SETUP_SECRET
            valueFrom:
              secretKeyRef:
                name: snatcharr-secrets
                key: setup-secret

  - it: positive - existingSecret renders deployment env with optional true
    set:
      secrets:
        existingSecret: ext-sec
    templates:
      - api-deployment.yaml
    asserts:
      - template: api-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_SNATCHARR_SETUP_SECRET
            valueFrom:
              secretKeyRef:
                name: ext-sec
                key: setup-secret
                optional: true

