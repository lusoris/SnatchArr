suite: secret existingSecret csrf-secret validation
templates:
  - secret.yaml
release:
  name: snatcharr
  namespace: snatcharr
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
tests:
  # Positive cases: valid 32-byte secret formats render without failure.
  - it: positive - existingSecret with csrf-secret 64 hex chars renders without failure
    set:
      secrets:
        existingSecret: ext-sec-hex64
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-hex64
            namespace: snatcharr
          data:
            # 64 hex characters (32 bytes): "a" x 64
            csrf-secret: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: positive - existingSecret with csrf-secret 32-byte base64 standard alphabet renders without failure
    set:
      secrets:
        existingSecret: ext-sec-b64-std
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-b64-std
            namespace: snatcharr
          data:
            # 43 standard base64 characters + "=": "A" x 42, then "+="
            csrf-secret: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBKz0=
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: positive - existingSecret with csrf-secret 32-byte base64 url alphabet renders without failure
    set:
      secrets:
        existingSecret: ext-sec-b64-url
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-b64-url
            namespace: snatcharr
          data:
            # 43 URL-safe base64 characters + "=": "A" x 42, then "-="
            csrf-secret: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBLT0=
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  # Negative cases: invalid lengths or alphabets trigger template refusal with exact message.
  - it: negative - existingSecret with 63 hex chars fails template
    set:
      secrets:
        existingSecret: ext-sec-hex63
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-hex63
            namespace: snatcharr
          data:
            # 63 hex characters: "a" x 63
            csrf-secret: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh
    asserts:
      - failedTemplate:
          errorMessage: "secret ext-sec-hex63: csrf-secret must be 32 bytes as hex or base64 (openssl rand -hex 32)"

  - it: negative - existingSecret with 65 hex chars fails template
    set:
      secrets:
        existingSecret: ext-sec-hex65
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-hex65
            namespace: snatcharr
          data:
            # 65 hex characters: "a" x 65
            csrf-secret: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    asserts:
      - failedTemplate:
          errorMessage: "secret ext-sec-hex65: csrf-secret must be 32 bytes as hex or base64 (openssl rand -hex 32)"

  - it: negative - existingSecret with 31-byte base64 fails template
    set:
      secrets:
        existingSecret: ext-sec-b64-31
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-b64-31
            namespace: snatcharr
          data:
            # 31-byte base64: "A" x 42, then "=="
            csrf-secret: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBPT0=
    asserts:
      - failedTemplate:
          errorMessage: "secret ext-sec-b64-31: csrf-secret must be 32 bytes as hex or base64 (openssl rand -hex 32)"

  - it: negative - existingSecret with non-hex garbage fails template
    set:
      secrets:
        existingSecret: ext-sec-garbage
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-garbage
            namespace: snatcharr
          data:
            # 64 non-hex characters ('g' * 64)
            csrf-secret: Z2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZw==
    asserts:
      - failedTemplate:
          errorMessage: "secret ext-sec-garbage: csrf-secret must be 32 bytes as hex or base64 (openssl rand -hex 32)"

  # Boundary cases: missing secret, missing key, or generated secrets render without error.
  - it: boundary - existingSecret missing in cluster renders without refusal
    set:
      secrets:
        existingSecret: missing-sec
    # lookup returns empty, operator may create later
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: boundary - existingSecret without csrf-secret key renders without refusal
    set:
      secrets:
        existingSecret: ext-sec-no-csrf
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-no-csrf
            namespace: snatcharr
          data:
            other-key: dGVzdA==
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: boundary - generated secrets without existingSecret renders default Secret manifest
    set:
      secrets:
        existingSecret: ""
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: snatcharr-secrets
      - exists:
          path: stringData.crypto-key
      - exists:
          path: stringData.csrf-secret
      - exists:
          path: stringData.apikey-secret
      - exists:
          path: stringData.worker-token
