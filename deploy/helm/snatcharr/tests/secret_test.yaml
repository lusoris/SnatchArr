suite: secret existingSecret csrf-secret validation
templates:
  - secret.yaml
release:
  name: snatcharr
  namespace: snatcharr
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
tests:
  # Boundary cases: missing secret, missing key, or generated secrets render without error.
  - it: boundary - existingSecret missing in cluster renders without refusal
    set:
      secrets:
        existingSecret: missing-sec
    # lookup returns empty, operator may create later
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: boundary - existingSecret without csrf-secret key renders without refusal
    set:
      secrets:
        existingSecret: ext-sec-no-csrf
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ext-sec-no-csrf
            namespace: snatcharr
          data:
            other-key: dGVzdA==
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: boundary - generated secrets without existingSecret renders default Secret manifest
    set:
      secrets:
        existingSecret: ""
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: snatcharr-secrets
      - exists:
          path: stringData.crypto-key
      - exists:
          path: stringData.csrf-secret
      - exists:
          path: stringData.apikey-secret
      - exists:
          path: stringData.worker-token
