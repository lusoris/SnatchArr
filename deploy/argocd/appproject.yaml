apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: snatcharr
  namespace: argocd
spec:
  description: SnatchArr (control plane, worker, CloudNativePG)
  sourceRepos:
    - https://github.com/lusoris/SnatchArr
    - ghcr.io/lusoris/charts
  destinations:
    - namespace: snatcharr
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
