#
# Homelab install: Postgres, the SnatchArr API (with the web UI) and one snatch worker on one
# Docker host. Install, upgrade and backup steps: docs/install-compose.md.
#
#   cp env.example .env     # then fill in every secret
#   docker compose up -d
#
# Images are pinned by version and digest; Renovate moves the pins. Secrets come from .env next
# to this file, and compose refuses to start while one of them is unset.
#
# Health: Postgres reports its health here. The API and worker images from 0.1.9 have no
# shell and no probe command, so they get their health checks with the first release that
# ships `healthcheck` in both binaries.

name: snatcharr

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: snatcharr
      POSTGRES_DB: snatcharr
      POSTGRES_PASSWORD: ${SNATCHARR_DB_PASSWORD:?set SNATCHARR_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snatcharr -d snatcharr"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    <<: *hardening
    image: ghcr.io/lusoris/snatcharr-api:0.8.0@sha256:1b93f5958669aba5c96a306e7c16a26e1fddfb2c6e266a44c9cf11d1bb31e174
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DB_DSN: postgres://snatcharr:${SNATCHARR_DB_PASSWORD}@postgres:5432/snatcharr?sslmode=disable
      APP_CRYPTO_KEY: ${SNATCHARR_CRYPTO_KEY:?set SNATCHARR_CRYPTO_KEY in .env}
      APP_HTTP_CSRF_SECRET: ${SNATCHARR_CSRF_SECRET:?set SNATCHARR_CSRF_SECRET in .env}
      APP_SNATCHARR_APIKEY_SECRET: ${SNATCHARR_APIKEY_SECRET:?set SNATCHARR_APIKEY_SECRET in .env}
      APP_SNATCHARR_WORKER_TOKEN: ${SNATCHARR_WORKER_TOKEN:?set SNATCHARR_WORKER_TOKEN in .env}
      APP_SNATCHARR_SETUP_SECRET: ${SNATCHARR_SETUP_SECRET:?set SNATCHARR_SETUP_SECRET in .env}
      APP_SNATCHARR_PUBLIC_URL: ${SNATCHARR_PUBLIC_URL:-http://localhost:8080}
      APP_SNATCHARR_SESSION_SECURE: ${SNATCHARR_SESSION_SECURE:-true}
    ports:
      - "${SNATCHARR_BIND:-127.0.0.1}:${SNATCHARR_PORT:-8080}:8080"

  worker:
    <<: *hardening
    image: ghcr.io/lusoris/snatcharr-worker:0.8.0@sha256:2bd7c3a608202bf7a9bd833f137d2f29eae5fd6bec43d69a2adaf41824b21a6a
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SNATCH_API_GRPC: http://api:9090
      SNATCH_WORKER_TOKEN: ${SNATCHARR_WORKER_TOKEN:?set SNATCHARR_WORKER_TOKEN in .env}

volumes:
  postgres-data:
