#
# Local development stack. `make dev` starts postgres; profiles add real *arr apps for
# integration tests and an observability trio.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d postgres
#   docker compose -f deploy/compose/docker-compose.yml --profile arr up -d
#   docker compose -f deploy/compose/docker-compose.yml --profile observability up -d

name: snatcharr

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: snatcharr
      POSTGRES_PASSWORD: snatcharr
      POSTGRES_DB: snatcharr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snatcharr -d snatcharr"]
      interval: 5s
      timeout: 3s
      retries: 20

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    profiles: [arr]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - sonarr-config:/config

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    profiles: [arr]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - radarr-config:/config

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  sonarr-config:
  radarr-config:
