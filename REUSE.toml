version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
path = ["**/*.md", "docs/**", "web/messages/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Case lists ported from s4ntrx/Cybersecurity-Threats-Guide (MIT), commit
# 34c9097f8d40f573b8ff10612813424c6711d574, 02-web-application-security.
[[annotations]]
path = ["api/internal/app/websecurity_integration_test.go", "web/e2e/security.test.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 s4ntrx"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["web/static/licences.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# Brand mark: derived from "Female vulva.svg" by T. Kebert, Wikimedia Commons,
# CC BY-SA 4.0, modified (https://commons.wikimedia.org/wiki/File:Female_vulva.svg).
# Changes: cropped to the vulva, clitoral glans enlarged, vaginal opening shaded,
# recoloured, strokes widened, simplified cut below 40 px. The visual baselines
# show the mark, so they carry its licence too.
[[annotations]]
path = [
  "web/src/lib/components/BrandMark.svelte",
  "web/static/brand/mark.svg",
  "docs/assets/mark.svg",
  "web/static/favicon-32x32.png",
  "web/static/apple-touch-icon.png",
  "web/e2e/visual/*.png",
  "web/e2e/visual/redo/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = ["2024 T. Kebert", "2026 lusoris <lusoris@pm.me>"]
SPDX-License-Identifier = "CC-BY-SA-4.0"
