#
# Upstream OpenAPI specs the contract tests check the hand-written clients against
# (docs/upstream-contracts.md). `make contracts-verify` downloads each file at its commit and
# refuses it when its sha256 differs. Nothing listed here is committed or copied into an image.
#
# Renovate reads repository, tag and commit, in this order (customManagers in renovate.json), and
# proposes the next stable upstream release. A project that tags no release is pinned with
# `branch` in the place of `tag`; Renovate then proposes the newest commit of that branch. When
# the spec file changed with the proposed commit, the sha256 no longer fits and the gate fails
# until the pin is renewed by hand:
#
#   go run ./tools/upstreamspec fetch    # prints the sha256 of the new file
#
# operations: "<METHOD> <path>" as the client requests it. `prefix` is the part of the path the
# spec leaves to its `servers` entry.
#
# commands: the upstream C# command classes whose bodies the worker sends to `POST .../command`,
# each by path and sha256 at the commit of its spec. The OpenAPI spec cannot describe those bodies
# (CommandResource lists the generic properties and forbids others), so `fetch` reads the public
# properties of each class into the contract file and the Rust contract test compares every body
# it receives with them. An entry with a `POST .../command` operation must list its classes.
