#
# Real Sonarr, Radarr, Lidarr, Readarr, Prowlarr, Whisparr v2, Whisparr v3, Seerr,
# SABnzbd and qBittorrent, each pinned by digest, for tools/e2e/integrations_live.sh.
# Every port is published on loopback only. Renovate's docker-compose manager keeps
# the pins current.

x-linuxserver: &linuxserver
  environment: &env
    PUID: ${INTEGRATIONS_UID:-1000}
    PGID: ${INTEGRATIONS_GID:-1000}
    TZ: Etc/UTC

services:
  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    environment:
      <<: *env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:-}
    ports: ["127.0.0.1:${SONARR_PORT:-18301}:8989"]

  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls321@sha256:ea6822c956d26db648b237919f41340318f32e5b7dcc4ba702cf256a0f5f3c12
    environment:
      <<: *env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
    ports: ["127.0.0.1:${RADARR_PORT:-18302}:7878"]

  lidarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls43@sha256:67887807b13ae025c0fe979da298347c8609969087ab064c81d8e9acc1e06bbf
    environment:
      <<: *env
      LIDARR__AUTH__APIKEY: ${LIDARR_API_KEY:-}
    ports: ["127.0.0.1:${LIDARR_PORT:-18303}:8686"]

  readarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/readarr:develop-0.4.18.2805-ls157@sha256:baf471a7101b58f361ef960de91cd15f23bae82d0126df6a9edbeaf5c5aa4392
    environment:
      <<: *env
      READARR__AUTH__APIKEY: ${READARR_API_KEY:-}
    ports: ["127.0.0.1:${READARR_PORT:-18304}:8787"]

  prowlarr:
    <<: *linuxserver
    image: ghcr.io/hotio/prowlarr:release@sha256:ed37728f55a3e1f1049600ffcae4f266b83bcc804546963a9fdbea9a31d89c48
    environment:
      <<: *env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:-}
    ports: ["127.0.0.1:${PROWLARR_PORT:-18305}:9696"]

  whisparr_v2:
    <<: *linuxserver
    image: ghcr.io/hotio/whisparr:v2-2.0.0.2151@sha256:9d15d756ccdc776cfe3ca962884af04e337365fbc03d2b492bea805e5bfb8d5c
    volumes: ["${INTEGRATIONS_CONFIG_DIR:-/tmp}/whisparr_v2:/config"]
    ports: ["127.0.0.1:${WHISPARR_V2_PORT:-18306}:6969"]

  whisparr_v3:
    <<: *linuxserver
    image: ghcr.io/hotio/whisparr:v3-3.1.0.2116@sha256:e522eec938fb0d0980d90b28304c3ef768b81ad95874092be26d8d764f1180e8
    environment:
      <<: *env
      WHISPARR__AUTH__APIKEY: ${WHISPARR_V3_API_KEY:-}
    ports: ["127.0.0.1:${WHISPARR_V3_PORT:-18307}:6969"]

  seerr:
    <<: *linuxserver
    image: ghcr.io/hotio/seerr:release@sha256:e46b35217937a733882b0f8f005a8c5f559743c0b6457ad9d64dc80ca5c0af91
    volumes: ["${INTEGRATIONS_CONFIG_DIR:-/tmp}/seerr:/config"]
    ports: ["127.0.0.1:${SEERR_PORT:-18308}:5055"]

  sabnzbd:
    <<: *linuxserver
    image: lscr.io/linuxserver/sabnzbd:5.1.3@sha256:7a13af91cf296399e302d2fb6fc709d6e2ea15e3094f220684611fbe1dd43625
    ports: ["127.0.0.1:${SABNZBD_PORT:-18309}:8080"]

  qbittorrent:
    <<: *linuxserver
    image: docker.io/linuxserver/qbittorrent:5.2.4@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
    environment:
      <<: *env
      WEBUI_PORT: ${QBITTORRENT_PORT:-18310}
    ports: ["127.0.0.1:${QBITTORRENT_PORT:-18310}:${QBITTORRENT_PORT:-18310}"]
