name: Setup Licences Toolchain
description: Sets up Go, pnpm, Node.js 24, web dependencies, and cargo-about for third-party licences.
runs:
  using: composite
  steps:
    - name: Set up Go toolchain
      uses: ./.github/actions/setup-go
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: web/package.json
    - name: Set up Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Install web dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
    - name: Install cargo-about
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: cargo-about@0.9.2
        fallback: none
