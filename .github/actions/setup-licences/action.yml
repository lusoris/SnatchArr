name: Setup Licences Toolchain
description: Sets up Go, pnpm, Node.js 24, web dependencies, and cargo-about for third-party licences.
runs:
  using: composite
  steps:
    - name: Set up Go toolchain
      uses: ./.github/actions/setup-go
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: web/package.json
    - name: Set up Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Install web dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
    - name: Install cargo-about
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-about@0.9.2
        fallback: none
