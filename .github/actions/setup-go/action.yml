name: Setup Go
description: Sets up Go toolchain with module cache pinned from go.mod and go.sum.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
