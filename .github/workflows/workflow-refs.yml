#
# Standalone guard against renamed or transferred repositories in workflow and composite action
# `uses:` references. Calls no reusable workflow and no action besides actions/checkout, whose
# repository name the first step checks against the GitHub API before checkout runs, so a moved
# reference in ci.yml or in actions/checkout itself cannot hide behind a failed job start, and
# the daily schedule catches a repository move that happens with no pull request. Only public
# repositories are supported: GITHUB_TOKEN cannot read private or missing repositories, so any
# such reference fails.
name: Workflow references

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-refs:
    name: Workflow repository references
    # Linux only (HISS-21): the check reads repository files and the GitHub API, so its verdict
    # does not depend on the runner OS, and the scripts need bash 4 or newer (mapfile, ${var,,}).
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # GitHub Actions does not follow a moved action repository, so a moved actions/checkout
      # stops the job before workflow_refs.sh can name it; check its current full_name first.
      - name: Check the checkout action repository name before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_REPO: actions/checkout
        run: |
          set -euo pipefail
          full="$(timeout 30 gh api "repos/$BOOTSTRAP_REPO" --jq .full_name)"
          if [ "$full" != "$BOOTSTRAP_REPO" ]; then
            echo "error: $BOOTSTRAP_REPO moved to $full: update the checkout step of this workflow" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PyYAML for the workflow parser (pinned by hash)
        run: bash tools/ci/pyyaml_venv.sh "$RUNNER_TEMP/pyyaml"
      - name: Planted cases for the repository-name check
        env:
          PYTHON_BIN: ${{ runner.temp }}/pyyaml/bin/python
        run: bash tools/ci/workflow_refs_test.sh
      - name: Check workflow and composite action repository names
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_BIN: ${{ runner.temp }}/pyyaml/bin/python
        run: bash tools/ci/workflow_refs.sh
