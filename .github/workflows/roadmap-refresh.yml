#
# Keeps the docs/roadmap.md milestone table in step with the GitHub milestones without a hand run:
# every day it renders the table from the open milestones and, when an open count or a scope
# moved, proposes the change as a bot pull request (tools/ci/roadmap_refresh_pr.sh). make
# verify-all checks only the table's shape, offline, so a moved count never turns it red.
#
# A manual run with plant_stale set plants a stale count after the render and runs the
# pull-request step as a dry run: its log shows the bot path without opening a pull request.
name: Roadmap refresh

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      plant_stale:
        description: Plant a stale count and dry-run the pull-request step
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: roadmap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Roadmap milestone table
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the table from the open milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci/roadmap_render.py --write --repo "$GITHUB_REPOSITORY"
      - name: Plant a stale count
        if: inputs.plant_stale
        run: |
          sed -i -E '0,/^\| \[.*\| [0-9]+ \|$/s/\| [0-9]+ \|$/| 99999 |/' docs/roadmap.md
          git diff --stat -- docs/roadmap.md
          ! git diff --quiet -- docs/roadmap.md
      # A token from the GitHub App, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN
      # starts no workflow, so its required checks would never run.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ !inputs.plant_stale }}
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose the change as a bot pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.plant_stale && '1' || '' }}
        run: sh tools/ci/roadmap_refresh_pr.sh
