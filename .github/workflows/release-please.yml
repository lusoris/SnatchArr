name: release-please

on:
  push:
    branches: [main]

# The job acts through the snatcharr-release GitHub App, not GITHUB_TOKEN: pull requests and
# releases created with GITHUB_TOKEN start no workflows, so release pull requests got no CI and
# releases never started release.yml (#9).
permissions: {}

jobs:
  release-please:
    name: Release
    uses: plurano/horistes/.github/workflows/release-please.yml@c9632c6f9a06ccd560ffe4e1637649bcf19221db # main
    with:
      app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
