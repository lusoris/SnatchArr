name: release-please

on:
  push:
    branches: [main]

# The job acts through the snatcharr-release GitHub App, not GITHUB_TOKEN: pull requests and
# releases created with GITHUB_TOKEN start no workflows, so release pull requests got no CI and
# releases never started release.yml (#9).
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # No release-type input: with it set the action ignores the config file
          # (initial-version, bump-minor-pre-major) and proposes 1.0.0.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
