name: release-please-app

on:
  workflow_call:
    inputs:
      config-file:
        description: 'Path to the release-please config file'
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: 'Path to the release-please manifest file'
        required: false
        type: string
        default: .release-please-manifest.json
      client-id:
        description: 'Client ID of the release GitHub App (defaults to vars.RELEASE_APP_CLIENT_ID)'
        required: false
        type: string
        default: ''
    secrets:
      private-key:
        description: 'Private key of the release GitHub App'
        required: true

# The job acts through the snatcharr-release GitHub App, not GITHUB_TOKEN: pull requests and
# releases created with GITHUB_TOKEN start no workflows, so release pull requests got no CI and
# releases never started release.yml (#9).
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.client-id != '' && inputs.client-id || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # No release-type input: with it set the action ignores the config file
          # (initial-version, bump-minor-pre-major) and proposes 1.0.0.
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
