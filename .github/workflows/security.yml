name: Security Scan

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  go-vulncheck:
    name: api (govulncheck + gosec)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install tools
        run: |
          make -C .. gosec-install
      - name: govulncheck
        # The target make api-verify runs: the tools/go/go.mod pin, its version printed first (#161).
        run: make -C .. api-vuln
      - name: gosec (zero exclusions)
        # From the module root: started in api/, gosec loads no package and passes on zero files.
        working-directory: ${{ github.workspace }}
        run: |
          make api-gosec
          # The files under tools/ that build only with the apicompatgate tag.
          make tools-gosec
      - name: Upload gosec results to code scanning
        # The run on main is the one that opens and closes the alerts of the default branch.
        if: ${{ !cancelled() && hashFiles('api/tmp/gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: api/tmp/gosec.sarif
          category: gosec/api

  rust-audit:
    name: worker (cargo-audit + cargo-deny)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's rustup installs the release pinned in rust-toolchain.toml.
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # Prebuilt, checksum-verified binaries; no Docker Hub pull (cargo-deny-action hit 429s).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - name: cargo-audit
        run: cargo audit
      - name: cargo-deny (advisories)
        run: cargo deny check advisories

  web-audit:
    name: web (pnpm audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pinned version lives in web/package.json#packageManager, not at the root.
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: pnpm audit
        run: cd web && pnpm audit --audit-level=high

  dependency-submission:
    name: web (dependency graph snapshot)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate dependency snapshot
        env:
          TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          set -euo pipefail
          docker pull --quiet "$TRIVY_IMAGE"
          python3 -I tools/ci/dependency_snapshot.py --trivy "$TRIVY_IMAGE" --out "$RUNNER_TEMP/snapshot.json"
      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json"

  # A failed scan on main opens the issue "Security Scan fails on main", or comments on it while it
  # is open: new advisories against unchanged code reach the issue list, not only the run email
  # (gap audit A2-02). Pull requests run the same scanners under "CI success".
  report:
    name: Open an issue on a failure on main
    needs: [go-vulncheck, rust-audit, web-audit, dependency-submission]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
