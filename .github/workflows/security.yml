name: Security Scan

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  go-vulncheck:
    name: api (govulncheck + gosec)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make -C .. gosec-install
      - name: govulncheck
        run: govulncheck ./...
      - name: gosec (zero exclusions)
        # From the module root: started in api/, gosec loads no package and passes on zero files.
        working-directory: ${{ github.workspace }}
        run: |
          make api-gosec
          # The files under tools/ that build only with the apicompatgate tag.
          make tools-gosec
      - name: Upload gosec results to code scanning
        # The run on main is the one that opens and closes the alerts of the default branch.
        if: ${{ !cancelled() && hashFiles('api/tmp/gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: api/tmp/gosec.sarif
          category: gosec/api

  rust-audit:
    name: worker (cargo-audit + cargo-deny)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Prebuilt, checksum-verified binaries; no Docker Hub pull (cargo-deny-action hit 429s).
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - name: cargo-audit
        run: cargo audit
      - name: cargo-deny (advisories)
        run: cargo deny check advisories

  web-audit:
    name: web (pnpm audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pinned version lives in web/package.json#packageManager, not at the root.
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: pnpm audit
        run: cd web && pnpm audit --audit-level=high
