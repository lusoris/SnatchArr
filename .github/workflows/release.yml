#
# Runs when release-please publishes a GitHub release (tag vX.Y.Z). Builds and pushes both
# images (multi-arch, SBOM + provenance attestations, cosign keyless), pushes the Helm chart
# as an OCI artifact and attaches chart + SBOMs to the release. Every `uses:` is SHA-pinned.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.0
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/lusoris/snatcharr-api
  IMAGE_WORKER: ghcr.io/lusoris/snatcharr-worker
  CHART_REPO: oci://ghcr.io/lusoris/charts

jobs:
  meta:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.component }})
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: Dockerfile
          - component: worker
            context: .
            dockerfile: worker/Dockerfile
    outputs:
      digest-api: ${{ steps.out.outputs.digest-api }}
      digest-worker: ${{ steps.out.outputs.digest-worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/lusoris/snatcharr-${{ matrix.component }}
          # Semver only: no floating `latest`, so every deployment pins what it runs.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=snatcharr-${{ matrix.component }}
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.documentation=https://lusoris.github.io/SnatchArr/
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.release.published_at || github.run_started_at }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/lusoris/snatcharr-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/lusoris/snatcharr-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM (SPDX) attached to the release
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/lusoris/snatcharr-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          artifact-name: snatcharr-${{ matrix.component }}-${{ needs.meta.outputs.version }}.spdx.json
          output-file: snatcharr-${{ matrix.component }}-${{ needs.meta.outputs.version }}.spdx.json
          upload-release-assets: ${{ github.event_name == 'release' }}
      - id: out
        run: echo "digest-${{ matrix.component }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  chart:
    name: helm chart
    needs: [meta, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: lint + package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          helm lint deploy/helm/snatcharr
          helm package deploy/helm/snatcharr --version "$VERSION" --app-version "$VERSION" -d dist
      - name: push to ${{ env.CHART_REPO }}
        id: push
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          helm push "dist/snatcharr-${VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          DIGEST=$(sed -n 's/^Digest: //p' push.log)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: cosign sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/lusoris/charts/snatcharr@${DIGEST}"
      - name: attach chart to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" dist/snatcharr-*.tgz --clobber
