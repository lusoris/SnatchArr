#
# Runs when release-please publishes a GitHub release (tag vX.Y.Z). After the image smoke test
# it calls release-build.yml, which builds and pushes both images (multi-arch, SBOM +
# provenance attestations, cosign keyless) and the Helm chart as an OCI artifact (cosign
# keyless + provenance attestation) in a reusable workflow of its own (SLSA Build Level 3,
# #42). This workflow then attaches chart, SBOMs, a checksum file and one provenance bundle
# covering all of them to the release. The last job verifies every artifact against the
# commit of the tag and fails the release when one is not covered. Every `uses:` is SHA-pinned.
#
# A rebuild by workflow_dispatch runs on the tag itself (gh workflow run release.yml
# --ref vX.Y.Z -f tag=vX.Y.Z): the signing certificates name the commit the workflow ran on,
# and the verify job requires that commit to be the commit of the tag.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.0
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/lusoris/snatcharr-api
  IMAGE_WORKER: ghcr.io/lusoris/snatcharr-worker

jobs:
  meta:
    name: resolve tag
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1 ;; esac
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::run the release workflow on the tag it builds (--ref $TAG), not on $GITHUB_REF"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image-smoke:
    name: image smoke (e2e amd64 + arm64 exec)
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: smoke
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false
      - id: date
        run: echo "commit=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-buildx
        with:
          qemu: 'true'
      - name: Build api image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: snatcharr-api:e2e
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.release.published_at || steps.date.outputs.commit }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: snatcharr-worker:e2e
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.release.published_at || steps.date.outputs.commit }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: make e2e-image-smoke
        env:
          SMOKE_DSN: postgres://postgres:smoke@127.0.0.1:5432/postgres?sslmode=disable
          SMOKE_SKIP_BUILD: '1'
        run: make e2e-image-smoke
      - name: Build api image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: snatcharr-api:arm64-test
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.release.published_at || steps.date.outputs.commit }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: snatcharr-worker:arm64-test
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.release.published_at || steps.date.outputs.commit }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Verify arm64 execution
        run: tools/e2e/arm64-check.sh snatcharr-api:arm64-test snatcharr-worker:arm64-test

  # The images and the chart are built, signed and attested in release-build.yml, a reusable
  # workflow of its own, so their certificates name a workflow that only builds (#42).
  build:
    name: build
    needs: [meta, image-smoke]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release-files:
    name: release page files
    needs: [meta, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: download the chart archive and the image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snatcharr-*${{ needs.meta.outputs.version }}*
          merge-multiple: true
          path: built
      # Every file of the release page is a subject of one provenance attestation, the
      # checksum file included; the bundle travels with the files, so a consumer verifies them
      # with cosign and no forge login (tools/release/verify.sh --bundle).
      - name: stage the release files and their checksums
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir release
          cp "built/snatcharr-${VERSION}.tgz" built/*.spdx.json release/
          cd release
          sha256sum -- *.tgz *.spdx.json > "snatcharr-${VERSION}-SHA256SUMS"
          cat "snatcharr-${VERSION}-SHA256SUMS"
      - id: files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: add the provenance bundle
        env:
          BUNDLE: ${{ steps.files.outputs.bundle-path }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: cp "$BUNDLE" "release/snatcharr-${VERSION}-provenance.sigstore.json"
      # Runs on workflow_dispatch too: a rebuild of an existing tag re-attaches its assets.
      - name: attach chart, SBOMs, checksums and provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" release/* --clobber

  # Reads the registry and the release page with cosign and no login, as a consumer does, and
  # pins every artifact to the commit of the tag. tools/release/verify.sh exits 3 on a refused
  # signature, 4 on a refused attestation and 5 on both; the selftest proves each refusal on
  # the published 0.1.4 artifacts before the new ones are checked, and the page check proves
  # its refusals on a tampered copy and a wrong commit.
  verify:
    name: verify signatures and provenance
    needs: [meta, build, release-files]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: the check refuses an unsigned, unattested or foreign artifact
        run: tools/release/verify-selftest.sh
      - name: resolve the commit of the tag
        id: tag
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          COMMIT=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG^{}" "refs/tags/$TAG" \
            | awk 'NR == 1 || /\^\{\}$/ { commit = $1 } END { print commit }')
          case "$COMMIT" in [0-9a-f]*) ;; *) echo "::error::tag $TAG has no commit"; exit 1 ;; esac
          echo "$TAG is commit $COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: verify both images and the chart
        env:
          API: ${{ env.IMAGE_API }}@${{ needs.build.outputs.digest-api }}
          WORKER: ${{ env.IMAGE_WORKER }}@${{ needs.build.outputs.digest-worker }}
          CHART: ${{ env.REGISTRY }}/lusoris/charts/snatcharr@${{ needs.build.outputs.digest-chart }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          for reference in "$API" "$WORKER" "$CHART"; do
            tools/release/verify.sh "$reference" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$COMMIT"
          done
      - name: verify the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          gh release download "$TAG" --dir page
          tools/release/verify-page.sh page "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$COMMIT"
          # expect <status> <case> <directory> <commit>: one refusal the page check must make.
          expect() {
            got=0
            tools/release/verify-page.sh "$3" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$4" || got=$?
            if [ "$got" -ne "$1" ]; then echo "::error::$2: exit $got, want $1"; exit 1; fi
            echo "ok   $2: exit $got"
          }
          expect 4 "files of another commit are refused" page 0000000000000000000000000000000000000000
          cp -R page tampered
          printf 'x' >> "tampered/snatcharr-${VERSION}.tgz"
          sha256sum -- tampered/*.tgz tampered/*.spdx.json | sed 's| tampered/| |' > "tampered/snatcharr-${VERSION}-SHA256SUMS"
          expect 4 "a changed chart with a rewritten checksum file is refused" tampered "$COMMIT"
