name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages (Conventional Commits + DCO)
    # Bots (release-please, Renovate) run no commit-msg hook and cannot certify a DCO; the
    # squash commit a maintainer merges carries the sign-off for them.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the policy against its cases
        run: sh .config/hooks/commit-msg_test.sh
      # The same script the commit-msg hook runs, applied to every commit of the pull request.
      - name: Check every commit of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges --max-count=500 "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! sh .config/hooks/commit-msg.sh "$RUNNER_TEMP/msg"; then
              echo "::error title=Commit message::$c fails the commit-msg policy"
              status=1
            fi
          done
          exit "$status"

  # Runs on every change, with no filter: a change that touches no component skips the jobs
  # below, and the workflow files are then all that is left to gate.
  workflows:
    name: Workflows (actionlint, pinned actions)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The aggregate rule refuses its planted cases
        run: sh tools/ci/status_test.sh
      - name: The workflow check refuses its planted cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/workflow-check_test.sh
      - name: Lint workflows and check action pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/workflow-check.sh

  changes:
    name: Detect changed components
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A component only runs when it changed AND its manifest exists (scaffolding is incremental).
      api: ${{ steps.filter.outputs.api == 'true' && steps.present.outputs.api == 'true' }}
      worker: ${{ steps.filter.outputs.worker == 'true' && steps.present.outputs.worker == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' && steps.present.outputs.web == 'true' }}
      proto: ${{ steps.filter.outputs.proto == 'true' && steps.present.outputs.proto == 'true' }}
      deploy: ${{ steps.filter.outputs.deploy == 'true' && steps.present.outputs.deploy == 'true' }}
      governance: ${{ steps.filter.outputs.governance }}
      contracts: ${{ steps.filter.outputs.contracts == 'true' && steps.present.outputs.api == 'true' && steps.present.outputs.worker == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect scaffolded components
        id: present
        run: |
          {
            echo "api=$([ -f go.mod ] && echo true || echo false)"
            echo "worker=$([ -f Cargo.toml ] && echo true || echo false)"
            echo "web=$([ -f web/package.json ] && echo true || echo false)"
            echo "proto=$([ -f proto/buf.yaml ] && echo true || echo false)"
            echo "deploy=$([ -f deploy/helm/snatcharr/Chart.yaml ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'go.mod'
              - 'go.sum'
              - 'proto/**'
              - '.golangci.yml'
              - '.gosec.json'
              - 'tools/spectral.yaml'
              - 'tools/e2e/**'
              - 'tools/**/*.go'
              - 'exceptions.yaml'
              - 'Makefile'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            worker:
              - 'worker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            governance:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.standards*'
              - '.needs.yaml'
              - 'Makefile'
              - 'lefthook.yml'
              - '.config/**'
              - '.gemini/**'
              - '.codex/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'tools/upstreamspec/**'
              - 'renovate.json'
              - 'api/internal/seerrclient/**'
              - 'worker/crates/arr-client/**'
              - 'worker/crates/snatch-core/**'
              - 'go.mod'
              - 'go.sum'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.gitignore'
              - '.dockerignore'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # The Go jobs mirror golusoris' reusable ci-go.yml but pin tool versions that build with
  # Go 1.27 (the reusable workflow's govulncheck 1.4.0 panics on grpc-go generics).
  api-lint:
    name: api / lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go.mod and go.sum are tidy
        # A dependency update that leaves a requirement unused, or marked indirect while the code
        # imports it, still builds; this prints the missing changes and fails.
        run: go mod tidy -diff
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run --config ../.golangci.yml --timeout 10m ./...
      - name: golangci-lint over tools/
        # The same config from the module root, without and with the apicompatgate build tag. A
        # finding passes only with a dated exception in exceptions.yaml (tools/lintexcept).
        working-directory: ${{ github.workspace }}
        run: make tools-lint
      - name: go fix (modernizers) leaves no diff
        run: go fix -diff ./...
      - name: Generated code is committed
        run: |
          go generate ./...
          git diff --exit-code -- internal/build internal/gen internal/store/sqlcgen

  api-test:
    name: api / test (race + coverage)
    env:
      # The Postgres integration tests (api/internal/store/storetest) start containers through
      # testcontainers; pull its Docker Hub images (postgres, ryuk) from the mirror.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet + build
        run: cd api && go vet ./... && go build ./...
      - name: go test -race
        run: cd api && go test -race -count=1 -timeout 10m ./...
      - name: go vet + go test -race over tools/
        run: make tools-test
      - name: Coverage ratchet (non-generated packages)
        run: make api-cover

  api-security:
    name: api / security (gosec + govulncheck)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gosec (zero exclusions)
        # From the module root: started in api/, gosec loads no package and passes on zero files.
        working-directory: ${{ github.workspace }}
        run: |
          make gosec-install
          make api-gosec
          # api-gosec scans tools/ without the apicompatgate build tag; this is the scan with it.
          make tools-gosec
      - name: Upload gosec results to code scanning
        # Also after a finding, so the alert shows on the pull request. A pull request from a fork
        # has a read-only token and cannot upload; the gosec step above still decides the job.
        if: >-
          ${{ !cancelled() && hashFiles('api/tmp/gosec.sarif') != ''
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: api/tmp/gosec.sarif
          category: gosec/api
      - name: gosec annotations of generated code
        # Each finding in ogen, sqlc and protoc-gen-go output carries one `#nosec <rule> -- <reason>`
        # from tools/gennosec, and no annotation outlives its finding.
        run: go run ../tools/gennosec check
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  api-openapi:
    name: api / OpenAPI lint (spectral)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes @stoplight/spectral-cli@6.15.0 lint api/openapi/openapi.yaml --ruleset tools/spectral.yaml --fail-severity warn

  worker:
    name: worker (Rust)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked
      # Prebuilt, checksum-verified binaries from GitHub releases. cargo-deny-action built a
      # container from Docker Hub on every run and failed on its anonymous pull limit (429).
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit,cargo-deny,cargo-llvm-cov@0.9.1
          fallback: none
      - name: cargo-audit
        run: cargo audit
      - name: cargo-deny
        run: cargo deny check
      - name: Coverage (line floor)
        run: make worker-cover

  e2e:
    name: e2e (smoke)
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      # The Postgres the integration tests pin, through the Docker Hub mirror.
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_PASSWORD: smoke
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Postgres, the API, two workers and two fakearr instances: lease, stamina and dispatch
      # together (#19). The same target runs locally.
      - name: make e2e-smoke
        env:
          SMOKE_DSN: postgres://postgres:smoke@127.0.0.1:5432/postgres?sslmode=disable
        run: make e2e-smoke

  web:
    name: web (SvelteKit)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: golusoris/sveltesentio/.github/workflows/ci-sveltekit.yml@5b3b01ef8b0bd664acfa621eeb84a1c7e626e7da # main 2026-09-21
    with:
      node-version: '24'
      working-directory: web
      coverage-threshold: 50
      run-e2e: true

  proto:
    name: proto (buf)
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto
          push: false
          archive: false
          # The workflow token is read-only; results go to the job log instead of a PR comment.
          pr_comment: false
      - name: Generated Go stubs are committed
        # make proto-gen = buf generate + the HISS-09 SAFETY post-pass; raw buf generate would drift.
        run: make proto-gen && git diff --exit-code -- api/internal/gen

  deploy:
    name: deploy (Helm)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # Pinned release tarball, checksum from the release's checksums.txt (no install action
      # covers kustomize).
      - name: kustomize v5.8.2
        env:
          KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/kustomize.tgz" \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.2/kustomize_v5.8.2_linux_amd64.tar.gz
          echo "$KUSTOMIZE_SHA256  $RUNNER_TEMP/kustomize.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kustomize.tgz" -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The same checks as locally: strict lint, kubeconform on the default and all-features
      # renders (kubeconform runs from its pinned image), the kind overlay build and the render
      # guards (#116).
      - name: make deploy-verify
        run: make deploy-verify
      # kubeconform checks schemas only. The API server also validates semantics, such as an
      # ipBlock `except` having to lie inside its `cidr`, which shipped broken in 0.1.0. kind
      # runs here on the disposable runner only; locally it runs inside an incus VM (#61).
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chart-check
          # Same image kind v0.33.0 pins, from mirror.gcr.io: Docker Hub's anonymous pull limit
          # failed this step on shared runner IPs.
          node_image: mirror.gcr.io/kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: CloudNativePG operator (its CRDs and webhooks validate the Cluster)
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.28/releases/cnpg-1.28.0.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=180s
      - name: server-side dry run (default and all-features renders)
        run: |
          kubectl create namespace snatcharr
          helm template snatcharr deploy/helm/snatcharr --namespace snatcharr \
            | kubectl apply --dry-run=server --namespace snatcharr -f -
          helm template snatcharr deploy/helm/snatcharr --namespace snatcharr \
            --set networkPolicy.enabled=true --set api.ingress.enabled=true \
            --set worker.autoscaling.enabled=true --set api.pdb.enabled=true --set worker.pdb.enabled=true \
            --set configarr.enabled=true --set configarr.existingConfigMap=cfg --set configarr.existingSecret=sec \
            --set 'networkPolicy.arrCidrs={10.0.0.0/8,0.0.0.0/0}' \
            --set-json 'networkPolicy.arrPeers=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"media"}}},{"podSelector":{"matchLabels":{"app.kubernetes.io/name":"lidarr"}},"ports":[{"port":8686,"protocol":"TCP"}]}]' \
            | kubectl apply --dry-run=server --namespace snatcharr -f -

  # The hand-written clients against the OpenAPI specs their upstream projects publish. The specs
  # are downloaded at the commits pinned in tools/upstreamspec/specs.yaml and checked against their
  # sha256; they are never committed (docs/upstream-contracts.md).
  contracts:
    name: contracts (pinned upstream specs)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clients against the pinned upstream specs
        run: make contracts-verify

  governance:
    name: governance (praetor)
    needs: changes
    if: needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # PRAETOR_REF is the repository's engine pin: the git hooks and make read it from here
      # (.config/lefthook/engine.sh) and run the same engine CI installs. One value only.
      - name: Install praetorctl
        env:
          PRAETOR_REF: 9615f1b907cc7e677a3ae71f6e864deb4450b9de
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Context integrity
        run: praetorctl compile-context --verify
      - name: HISS audit
        run: praetorctl audit
      - name: Flavor audit
        # .workingdir/ ledgers are gitignored by praetor itself; the flavor requires them.
        run: |
          praetorctl state init --if-absent .
          praetorctl flavor audit --flavor=go-service .

  # The required check that stands for every job of this workflow. A job the change filter
  # leaves out ends as skipped, and a skipped job satisfies a required check on its own, so this
  # job reads every result (tools/ci/status.sh). A new job needs a line here and a rule there;
  # the workflows job fails until both exist.
  status:
    name: CI success
    if: always()
    needs:
      - commits
      - workflows
      - changes
      - api-lint
      - api-test
      - api-security
      - api-openapi
      - worker
      - e2e
      - web
      - proto
      - deploy
      - contracts
      - governance
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The condition of the commits job, word for word.
          COMMITS_EXPECTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot' }}
        run: sh tools/ci/status.sh
