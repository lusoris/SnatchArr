name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A component only runs when it changed AND its manifest exists (scaffolding is incremental).
      api: ${{ steps.filter.outputs.api == 'true' && steps.present.outputs.api == 'true' }}
      worker: ${{ steps.filter.outputs.worker == 'true' && steps.present.outputs.worker == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' && steps.present.outputs.web == 'true' }}
      proto: ${{ steps.filter.outputs.proto == 'true' && steps.present.outputs.proto == 'true' }}
      deploy: ${{ steps.filter.outputs.deploy == 'true' && steps.present.outputs.deploy == 'true' }}
      governance: ${{ steps.filter.outputs.governance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect scaffolded components
        id: present
        run: |
          {
            echo "api=$([ -f api/go.mod ] && echo true || echo false)"
            echo "worker=$([ -f worker/Cargo.toml ] && echo true || echo false)"
            echo "web=$([ -f web/package.json ] && echo true || echo false)"
            echo "proto=$([ -f proto/buf.yaml ] && echo true || echo false)"
            echo "deploy=$([ -f deploy/helm/snatcharr/Chart.yaml ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'proto/**'
              - '.golangci.yml'
              - '.gosec.json'
              - 'tools/spectral.yaml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            worker:
              - 'worker/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            governance:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - '.standards*'
              - '.needs.yaml'
              - 'Makefile'
              - 'lefthook.yml'
              - '.config/**'
              - '.cursor/**'
              - '.windsurfrules'
              - '.gemini/**'
              - '.codex/**'
              - '.github/copilot-instructions.md'
              - '.github/workflows/ci.yml'

  # The Go jobs mirror golusoris' reusable ci-go.yml but pin tool versions that build with
  # Go 1.27 (the reusable workflow's govulncheck 1.4.0 panics on grpc-go generics).
  api-lint:
    name: api / lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run --config ../.golangci.yml --timeout 10m ./...
      - name: go fix (modernizers) leaves no diff
        run: go fix -diff ./...
      - name: Generated code is committed
        run: |
          go generate ./...
          git diff --exit-code -- internal/build internal/gen internal/store/sqlcgen

  api-test:
    name: api / test (race + coverage)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: go vet + build
        run: cd api && go vet ./... && go build ./...
      - name: go test -race
        run: cd api && go test -race -count=1 -timeout 10m ./...
      - name: Coverage ratchet (non-generated packages)
        run: make api-cover

  api-security:
    name: api / security (gosec + govulncheck)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gosec (zero exclusions)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -conf ../.gosec.json -exclude-generated ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  api-openapi:
    name: api / OpenAPI lint (spectral)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npx --yes @stoplight/spectral-cli@6.15.0 lint api/openapi/openapi.yaml --ruleset tools/spectral.yaml --fail-severity warn

  worker:
    name: worker (Rust)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: cargo-audit
        run: cargo install cargo-audit --locked && cargo audit
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: worker/Cargo.toml
          command: check

  web:
    name: web (SvelteKit)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: golusoris/sveltesentio/.github/workflows/ci-sveltekit.yml@5b3b01ef8b0bd664acfa621eeb84a1c7e626e7da # main 2026-09-21
    with:
      node-version: '24'
      working-directory: web
      coverage-threshold: 70
      run-e2e: true

  proto:
    name: proto (buf)
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          input: proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto
          push: false
          archive: false
      - name: Generated Go stubs are committed
        # make proto-gen = buf generate + the HISS-09 SAFETY post-pass; raw buf generate would drift.
        run: make proto-gen && git diff --exit-code -- api/internal/gen

  deploy:
    name: deploy (Helm)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint deploy/helm/snatcharr
      - name: kubeconform
        run: |
          helm template snatcharr deploy/helm/snatcharr \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -ignore-missing-schemas -summary

  governance:
    name: governance (praetor)
    needs: changes
    if: needs.changes.outputs.governance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: Install praetorctl
        run: |
          go install github.com/cordanaLLM/praetor/cmd/standardsctl@b131e9eca668533d82881eaed2d2b19ec674de00
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Context integrity
        run: praetorctl compile-context --verify
      - name: HISS audit
        run: praetorctl audit
      - name: Flavor audit
        # .workingdir/ ledgers are gitignored by praetor itself; the flavor requires them.
        run: |
          praetorctl state init --if-absent .
          praetorctl flavor audit --flavor=go-service .
