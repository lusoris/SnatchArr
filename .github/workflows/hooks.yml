name: hooks

# Fails when the commit-msg hook copies in .config/hooks drift from the plurano/horistes files at
# the pinned commit, then runs the hook's own test against the copy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  hooks:
    name: Hooks
    permissions:
      contents: read
    uses: plurano/horistes/.github/workflows/hook-copy.yml@ba2be798db2e35e5f0ea2c8ffcf8e24a98169161 # main
