# SPDX-License-Identifier: EUPL-1.2

accepted = [
    "EUPL-1.2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

ignore-dev-dependencies = true
ignore-build-dependencies = true

# tonic 0.14.9 and tonic-prost 0.14.9 carry MIT headers in their source files, which
# cargo-about otherwise reads as licence texts. Pin the grpc-rust LICENSE instead.
[tonic.clarify]
license = "MIT"

[[tonic.clarify.files]]
path = "LICENSE"
checksum = "5c686e0f7978412b49187ae0e9f77e9b52eea9d8d2e6c0de8694b35817d873b1"

# The tonic-prost crate ships no LICENSE file; take it from the repository root.
[tonic-prost.clarify]
license = "MIT"

[[tonic-prost.clarify.git]]
path = "LICENSE"
checksum = "5c686e0f7978412b49187ae0e9f77e9b52eea9d8d2e6c0de8694b35817d873b1"
