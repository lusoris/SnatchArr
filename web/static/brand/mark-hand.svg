  SnatchArr SFW brand mark candidate (hand-snatch) — hand reaching down to
  snatch a media disc. Hand contour derived from "Hand reaching down Pinhead
  icon.svg" by Quincy Morgan (Wikimedia Commons,
  https://commons.wikimedia.org/wiki/File:Hand_reaching_down_Pinhead_icon.svg,
  CC0 1.0, uploaded 2026-03-06): converted from filled silhouette to open
  centerline + outline strokes in 0 0 100 100 viewBox, paired with a media
  disc and motion arcs, and recoloured to the SnatchArr oklch palette.
-->
