#
# pnpm settings (pnpm >= 10 no longer reads package.json#pnpm).
allowBuilds:
  esbuild: true
# pnpm holds back releases younger than a day. The fleet adopts releases of its own web
# framework at once: its own gates passed and no outside publish has to be waited out.
# Outside packages keep the hold.
minimumReleaseAgeExclude:
  - '@sveltesentio/*'
# GHSA-g3hv-75wg-m249: replace vulnerable minimatch versions with the patched release.
overrides:
  'minimatch@<11.0.1': 11.0.3
# Redocly calls the old CommonJS default; minimatch 11 requires its named export.
# Remove patch and minimatch override when @redocly/openapi-core supports minimatch >=10.
patchedDependencies:
  '@redocly/openapi-core@1.34.20': patches/@redocly__openapi-core@1.34.20.patch
