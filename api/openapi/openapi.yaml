openapi: 3.1.0
info:
  title: SnatchArr API
  version: 0.1.0
  description: |
    Control-plane API for SnatchArr. Every non-2xx response is an RFC 9457 problem
    (`application/problem+json`). Browser clients authenticate with the `snatcharr_session`
    cookie plus an `X-CSRF-Token` header on unsafe methods; automation uses an API key
    as a Bearer token.
  license:
    name: EUPL-1.2
    identifier: EUPL-1.2
servers:
  - url: /api/v1
tags:
  - name: system
    description: Service status
  - name: auth
    description: Setup, login and sessions
  - name: instances
    description: "*arr instances and their hunt policies"
  - name: hunts
    description: Runs, history, hourly caps and processed memory
  - name: schedules
    description: Pause and cap-override windows
  - name: download-clients
    description: Torrent and Usenet clients observed for backpressure (never driven)
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Service status and build information
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Problem"

  /auth/setup/status:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: Whether the first user still has to be created
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"

  /auth/setup:
    post:
      tags: [auth]
      operationId: completeSetup
      summary: Create the first admin user and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: User created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Problem"

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session, user and CSRF token
      responses:
        "200":
          description: Session
          headers:
            X-CSRF-Token:
              description: Token to echo on unsafe requests
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /instances:
    get:
      tags: [instances]
      operationId: listInstances
      summary: List instances (API keys are never returned)
      responses:
        "200":
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [instances]
      operationId: createInstance
      summary: Add a manual instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"

  /instances/test:
    post:
      tags: [instances]
      operationId: testInstanceInput
      summary: Probe credentials that are not stored yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getInstance
      summary: Get one instance
      responses:
        "200":
          description: Instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [instances]
      operationId: updateInstance
      summary: Update a manual instance (omit api_key to keep it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [instances]
      operationId: deleteInstance
      summary: Delete an instance and everything it owns
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/test:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [instances]
      operationId: testInstance
      summary: Probe a stored instance and record the outcome
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/policy:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getPolicy
      summary: Hunt policy of an instance
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuntPolicy"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [instances]
      operationId: updatePolicy
      summary: Replace the hunt policy of an instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HuntPolicy"
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HuntPolicy"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/runs:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [hunts]
      operationId: triggerRun
      summary: Queue a hunt run now (ignores the cycle interval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      responses:
        "201":
          description: Run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: A run for this kind is already queued or leased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/events:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    delete:
      tags: [hunts]
      operationId: deleteInstanceEvents
      summary: Clear the history of one instance
      responses:
        "204":
          description: Cleared
        default:
          $ref: "#/components/responses/Problem"

  /runs:
    get:
      tags: [hunts]
      operationId: listRuns
      summary: Recent hunt runs, newest first
      parameters:
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/cancel:
    post:
      tags: [hunts]
      operationId: cancelRun
      summary: Cancel a queued or leased run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cancelled
        default:
          $ref: "#/components/responses/Problem"

  /events:
    get:
      tags: [hunts]
      operationId: listEvents
      summary: Hunt history, newest first (cursor on before_id)
      parameters:
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - name: before_id
          in: query
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        default:
          $ref: "#/components/responses/Problem"

  /hourly-caps:
    get:
      tags: [hunts]
      operationId: getHourlyCaps
      summary: Per-instance hourly budget consumption
      responses:
        "200":
          description: Caps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapStatus"
        default:
          $ref: "#/components/responses/Problem"

  /state/reset:
    post:
      tags: [hunts]
      operationId: resetState
      summary: Forget processed items (one instance or all)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateReset"
      responses:
        "200":
          description: Rows forgotten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResetResult"
        default:
          $ref: "#/components/responses/Problem"

  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: All schedule windows
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Add a schedule window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"

  /schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [schedules]
      operationId: updateSchedule
      summary: Replace a schedule window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a schedule window
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /download-clients:
    get:
      tags: [download-clients]
      operationId: listDownloadClients
      summary: List download clients (secrets are never returned)
      responses:
        "200":
          description: Download clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [download-clients]
      operationId: createDownloadClient
      summary: Add a download client by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Problem"

  /download-clients/test:
    post:
      tags: [download-clients]
      operationId: testDownloadClientInput
      summary: Observe a download client whose credentials are not stored yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientStatus"
        default:
          $ref: "#/components/responses/Problem"

  /download-clients/status:
    get:
      tags: [download-clients]
      operationId: getDownloadClientStatus
      summary: Latest observation of every enabled download client (cached 20 s)
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientStatus"
        default:
          $ref: "#/components/responses/Problem"

  /download-clients/{clientId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [download-clients]
      operationId: getDownloadClient
      summary: Get one download client
      responses:
        "200":
          description: Download client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [download-clients]
      operationId: updateDownloadClient
      summary: Update a download client (omit secret to keep it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [download-clients]
      operationId: deleteDownloadClient
      summary: Delete a download client
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /download-clients/{clientId}/test:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    post:
      tags: [download-clients]
      operationId: testDownloadClient
      summary: Observe a stored download client now and record the outcome
      responses:
        "200":
          description: Observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientStatus"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/download-clients/discover:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [download-clients]
      operationId: discoverDownloadClients
      summary: Import the download clients this instance has configured
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResult"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: snatcharr_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        invalid-params:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string

    SystemStatus:
      type: object
      required: [name, version, commit, build_date, profile, setup_complete]
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        profile:
          type: string
          enum: [prod, dev]
        setup_complete:
          type: boolean

    SetupStatus:
      type: object
      required: [setup_complete]
      properties:
        setup_complete:
          type: boolean

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, viewer]

    Session:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time

    AppKind:
      type: string
      enum: [sonarr, radarr, lidarr, readarr, whisparr_v2, whisparr_v3]

    Instance:
      type: object
      required: [id, kind, name, base_url, enabled, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AppKind"
        name:
          type: string
        base_url:
          type: string
          format: uri
        enabled:
          type: boolean
        source:
          type: string
          enum: [manual, configarr]
        configarr_key:
          type: string
        last_seen_version:
          type: string
        last_check_at:
          type: string
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InstanceInput:
      type: object
      required: [kind, name, base_url, api_key]
      properties:
        kind:
          $ref: "#/components/schemas/AppKind"
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
        api_key:
          type: string
          minLength: 8
        enabled:
          type: boolean
          default: true

    InstanceUpdate:
      type: object
      required: [kind, name, base_url]
      properties:
        kind:
          $ref: "#/components/schemas/AppKind"
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
        api_key:
          type: string
          description: Omit or leave empty to keep the stored key
        enabled:
          type: boolean
          default: true

    ProbeResult:
      type: object
      required: [app_name, version]
      properties:
        app_name:
          type: string
        version:
          type: string

    HuntPolicy:
      type: object
      required:
        - missing_per_cycle
        - upgrade_per_cycle
        - cycle_interval_s
        - hourly_cap
        - selection
        - monitored_only
        - skip_future_releases
        - radarr_release_type
        - sonarr_missing_mode
        - sonarr_upgrade_mode
        - lidarr_missing_mode
        - processed_ttl_h
        - max_queue_size
        - await_command
        - page_size
      properties:
        missing_per_cycle:
          type: integer
          minimum: 0
          maximum: 100
        upgrade_per_cycle:
          type: integer
          minimum: 0
          maximum: 100
        cycle_interval_s:
          type: integer
          minimum: 60
          maximum: 604800
        hourly_cap:
          type: integer
          minimum: 1
          maximum: 500
        selection:
          type: string
          enum: [random, sequential]
        monitored_only:
          type: boolean
        skip_future_releases:
          type: boolean
        radarr_release_type:
          type: string
          enum: [physical, digital, cinema]
        sonarr_missing_mode:
          type: string
          enum: [episodes, season_packs, shows]
        sonarr_upgrade_mode:
          type: string
          enum: [episodes, season_packs]
        lidarr_missing_mode:
          type: string
          enum: [artist, album]
        processed_ttl_h:
          type: integer
          minimum: 1
          maximum: 8760
        max_queue_size:
          type: integer
          minimum: -1
          maximum: 100000
        await_command:
          type: boolean
        page_size:
          type: integer
          minimum: 10
          maximum: 1000
        updated_at:
          type: string
          format: date-time
          readOnly: true

    HuntKind:
      type: string
      enum: [missing, upgrade]

    RunTrigger:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/HuntKind"

    Run:
      type: object
      required: [id, instance_id, kind, status, queued_at, searched_count]
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/HuntKind"
        status:
          type: string
          enum: [queued, leased, done, failed, cancelled]
        leased_by:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        searched_count:
          type: integer
        error:
          type: string

    Event:
      type: object
      required: [id, instance_id, ts, level, type]
      properties:
        id:
          type: integer
          format: int64
        run_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        type:
          type: string
        entity_type:
          type: string
        entity_id:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string

    CapStatus:
      type: object
      required: [instance_id, used, cap, resets_at]
      properties:
        instance_id:
          type: string
          format: uuid
        used:
          type: integer
        cap:
          type: integer
        resets_at:
          type: string
          format: date-time

    StateReset:
      type: object
      properties:
        instance_id:
          type: string
          format: uuid

    StateResetResult:
      type: object
      required: [forgotten]
      properties:
        forgotten:
          type: integer
          format: int64

    ScheduleInput:
      type: object
      required: [name, days, start, end, tz, action, enabled]
      properties:
        instance_id:
          type: string
          format: uuid
          description: Omit for a global window
        name:
          type: string
          minLength: 1
          maxLength: 64
        days:
          type: array
          description: Weekdays the window applies to (0 = Sunday)
          minItems: 1
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        tz:
          type: string
          minLength: 1
        action:
          type: string
          enum: [pause, cap_override]
        cap_value:
          type: integer
          minimum: 1
          maximum: 500
        enabled:
          type: boolean

    Schedule:
      allOf:
        - $ref: "#/components/schemas/ScheduleInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    DownloadClientKind:
      type: string
      enum: [qbittorrent, transmission, deluge, rtorrent, sabnzbd, nzbget]

    DownloadClient:
      type: object
      required: [id, kind, protocol, name, base_url, username, enabled, source, max_active, bandwidth_budget_bps, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
          description: Absent when the client applies to every instance
        kind:
          $ref: "#/components/schemas/DownloadClientKind"
        protocol:
          type: string
          enum: [torrent, usenet]
        name:
          type: string
        base_url:
          type: string
        username:
          type: string
        enabled:
          type: boolean
        source:
          type: string
          enum: [manual, discovered]
        max_active:
          type: integer
          description: Defer hunts once this many downloads are active (0 = no limit)
        bandwidth_budget_bps:
          type: integer
          format: int64
          description: Bytes per second the client may use before hunts are paced (0 = off)
        last_check_at:
          type: string
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DownloadClientInput:
      type: object
      required: [kind, name, base_url]
      properties:
        instance_id:
          type: string
          format: uuid
          description: Pin the client to one instance; omit to apply it to every instance
        kind:
          $ref: "#/components/schemas/DownloadClientKind"
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
        username:
          type: string
        secret:
          type: string
          description: Password, or the API key for SABnzbd. On update, omit to keep the stored one.
        enabled:
          type: boolean
          default: true
        max_active:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
        bandwidth_budget_bps:
          type: integer
          format: int64
          minimum: 0
          default: 0

    DownloadClientStatus:
      type: object
      required: [name, kind, reachable, paused, active, queued, download_rate_bps, upload_rate_bps, checked_at]
      properties:
        client_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/DownloadClientKind"
        reachable:
          type: boolean
        paused:
          type: boolean
        active:
          type: integer
        queued:
          type: integer
        download_rate_bps:
          type: integer
          format: int64
        upload_rate_bps:
          type: integer
          format: int64
        version:
          type: string
        error:
          type: string
        checked_at:
          type: string
          format: date-time

    DiscoveryResult:
      type: object
      required: [imported, updated, removed, unsupported, warnings]
      properties:
        imported:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unsupported:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
