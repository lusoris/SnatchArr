          type: string
          description: Webhook URL for Discord, Slack and Teams, or the Apprise API notify URL ({server}/notify/{config key}) (write-only, never returned in responses)
        token:
          type: string
          description: Bearer token (write-only, never returned in responses)
        bot_token:
          type: string
          description: Telegram Bot token (write-only, never returned in responses)
        app_token:
          type: string
          description: Gotify App token (write-only, never returned in responses)
        password:
          type: string
          description: Password, sent as HTTP Basic Auth to an Apprise API server (write-only, never returned in responses)
        secret:
          type: string
          description: HMAC signing secret (write-only, never returned in responses)
        server_url:
          type: string
          description: Base URL for ntfy or Gotify
        topic:
          type: string
          description: ntfy topic name
        chat_id:
          type: string
          description: Telegram chat ID (e.g. -1001234567890 or @channel)
        channel:
          type: string
          description: Slack channel override
        username:
          type: string
          description: Display username override, or the HTTP Basic Auth user for an Apprise API server
        avatar_url:
          type: string
          description: Discord avatar URL override
        icon_emoji:
          type: string
          description: Slack icon emoji override
        parse_mode:
          type: string
          description: Telegram parse mode (e.g. HTML, MarkdownV2)
        theme_color:
          type: string
          description: Teams theme color hex without '#' (e.g. 0076D7)
        priority:
          type: integer
          description: Priority for ntfy (1-5) or Gotify (0-10)
        tags:
          type: array
          items:
            type: string
          description: Tags / emoji shortcodes for ntfy; for Apprise, the configuration tags to notify (any one matches)
        url:
          type: string
          description: Target endpoint URL for signed outgoing webhooks
        allow_private_network:
          type: boolean
          description: Allow webhooks to connect to loopback/private/internal IP addresses
          default: false
        allow_insecure_http:
          type: boolean
          description: Allow webhooks to connect over cleartext http://
          default: false

    NotificationChannelInput:
      type: object
      required: [name, kind, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/NotificationChannelKind"
        enabled:
          type: boolean
          default: true
        config:
          $ref: "#/components/schemas/NotificationChannelConfig"

    NotificationChannelUpdate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/NotificationChannelKind"
        enabled:
          type: boolean
          default: true
        config:
          $ref: "#/components/schemas/NotificationChannelConfig"

    NotificationChannel:
      type: object
      required: [id, name, kind, enabled, has_secret, config, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/NotificationChannelKind"
        enabled:
          type: boolean
        has_secret:
          type: boolean
          description: Whether a secret is stored for this channel
        config:
          $ref: "#/components/schemas/NotificationChannelConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationRuleEventKind:
      type: string
      enum: [run_failure_streak, circuit_opened, instance_unreachable, stamina_exhausted, seerr_request_snatched]

    NotificationRuleInput:
      type: object
      required: [name, event_kind, threshold, channel_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        event_kind:
          $ref: "#/components/schemas/NotificationRuleEventKind"
        threshold:
          type: integer
          minimum: 1
          default: 1
          description: "Trigger threshold (e.g. N consecutive failures for run_failure_streak)"
        enabled:
          type: boolean
          default: true
        channel_ids:
          type: array
          items:
            type: string
            format: uuid

    NotificationRuleUpdate:
      type: object
      required: [name, event_kind, threshold, channel_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        event_kind:
          $ref: "#/components/schemas/NotificationRuleEventKind"
        threshold:
          type: integer
          minimum: 1
          default: 1
        enabled:
          type: boolean
          default: true
        channel_ids:
          type: array
          items:
            type: string
            format: uuid

    NotificationRule:
      type: object
      required: [id, name, event_kind, threshold, enabled, channel_ids, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        event_kind:
          $ref: "#/components/schemas/NotificationRuleEventKind"
        threshold:
          type: integer
        enabled:
          type: boolean
        channel_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QueueRule:
      type: string
      enum:
        - stalled
        - slow
        - failed
        - import_blocked
        - id_matched
        - import_fixable
        - import_broken
        - import_not_wanted
        - unwanted_score
        - not_an_upgrade
        - duplicate
        - unwanted_unmonitored

    QueueRuleMode:
      type: string
      enum: [observe, act]

    QueueRuleSettings:
      type: object
      required: [mode, threshold]
      properties:
        mode:
          $ref: "#/components/schemas/QueueRuleMode"
        threshold:
          type: integer
          minimum: 1
          maximum: 100
        blocklist:
          description: Blocklist the release when the rule removes the item. Left out on write, the rule keeps its default (every rule except not_an_upgrade, duplicate and unwanted_unmonitored blocklists); reads always return the effective value.
          type: boolean

    QueueRules:
      type: object
      required:
        - stalled
        - slow
        - failed
        - import_blocked
        - unwanted_score
        - unwanted_unmonitored
      properties:
        stalled:
          $ref: "#/components/schemas/QueueRuleSettings"
        slow:
          $ref: "#/components/schemas/QueueRuleSettings"
        failed:
          $ref: "#/components/schemas/QueueRuleSettings"
        import_blocked:
          $ref: "#/components/schemas/QueueRuleSettings"
        id_matched:
          description: Force-imports a Sonarr or Radarr download the *arr matched to its series or movie by ID only, through a ManualImport of its clean, mapped candidates; it never removes or blocklists (ADR-0013). Optional on write so older clients keep working; left out, the rule takes its default settings. Reads always return it.
          $ref: "#/components/schemas/QueueRuleSettings"
        import_fixable:
          description: Force-imports a download whose import rejections are fixable (e.g. Lidarr/Readarr track/album match above floor, scene numbering mismatch); never removes or blocklists. Optional on write; left out, the rule takes its default settings. Reads always return it.
          $ref: "#/components/schemas/QueueRuleSettings"
        import_broken:
          description: Strikes and removes a download whose release is broken (e.g. no tracks matched, corrupt container, parser error) with blocklist and re-search. Optional on write; left out, the rule takes its default settings. Reads always return it.
          $ref: "#/components/schemas/QueueRuleSettings"
        import_not_wanted:
          description: Strikes and removes a download that is not wanted (e.g. release not requested, fewer tracks than existing release) with blocklist, without re-search. Optional on write; left out, the rule takes its default settings. Reads always return it.
          $ref: "#/components/schemas/QueueRuleSettings"
        unwanted_score:
          $ref: "#/components/schemas/QueueRuleSettings"
        not_an_upgrade:
          description: Strikes a download whose custom-format score does not beat the file already on disk (Sonarr and Radarr). Optional on write so older clients keep working; left out, the rule takes its default settings. Reads always return it.
          $ref: "#/components/schemas/QueueRuleSettings"
        duplicate:
          description: Strikes every download for an episode, movie, album or book except the one with the highest custom-format score; a tie keeps the lowest queue id. Optional on write so older clients keep working; left out, the rule takes its default settings. Reads always return it.
          $ref: "#/components/schemas/QueueRuleSettings"
        unwanted_unmonitored:
          $ref: "#/components/schemas/QueueRuleSettings"

    QueuePolicy:
      type: object
      required:
        - enabled
        - rules
        - grace_seconds
        - min_bytes_per_second
        - max_removals_per_sweep
      properties:
        enabled:
          type: boolean
        rules:
          $ref: "#/components/schemas/QueueRules"
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        min_bytes_per_second:
          type: integer
          format: int64
          minimum: 0
        min_custom_format_score:
          description: Lowest custom format score an item may have; left out, the unwanted_score rule is off.
          type: integer
          format: int32
        max_removals_per_sweep:
          type: integer
          minimum: 1
          maximum: 100
        max_imports_per_sweep:
          description: Most id_matched imports one sweep sends per instance. Optional on write so older clients keep working; left out, it takes the default of 25. Reads always return it.
          type: integer
          minimum: 1
          maximum: 100
        match_fixable_min_percent:
          description: Minimum album or book match percentage for fixable manual import (default 75).
          type: number
          format: double
          minimum: 0
          maximum: 100
        match_broken_below_percent:
          description: Album or book match percentage below which a release is considered broken (default 40; used by rematch fallback).
          type: number
          format: double
          minimum: 0
          maximum: 100
        track_fixable_min_percent:
          description: Minimum track match percentage for fixable manual import (default 50).
          type: number
          format: double
          minimum: 0
          maximum: 100
        track_broken_below_percent:
          description: Track match percentage below which a release is considered broken (default 40; used by rematch fallback).
          type: number
          format: double
          minimum: 0
          maximum: 100

    QueueStrike:
      type: object
      required:
        - download_id
        - queue_id
        - rule
        - count
        - threshold
        - last_seen
      properties:
        download_id:
          type: string
        queue_id:
          type: integer
          format: int32
        rule:
          $ref: "#/components/schemas/QueueRule"
        count:
          type: integer
        threshold:
          type: integer
        last_seen:
          type: string
          format: date-time
        imported_at:
          description: When the id_matched rule last sent a force import for this download; left out when it never did.
          type: string
          format: date-time
        import_refused:
          description: True when the last force import found no clean, mapped candidate and sent nothing.
          type: boolean

