components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: snatcharr_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
    NotificationChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        invalid-params:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string

    SystemStatus:
      type: object
      required: [name, version, commit, build_date, profile, setup_complete]
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        profile:
          type: string
          enum: [prod, dev]
        setup_complete:
          type: boolean
        worker_last_contact_at:
          type: string
          format: date-time
          description: >-
            When a worker last reached the control plane (LeaseRun or Heartbeat), newest over all
            workers. Absent when no worker has called since the retention window began.

    SetupStatus:
      type: object
      required: [setup_complete, secret_required]
      properties:
        setup_complete:
          type: boolean
        secret_required:
          type: boolean
          description: Whether a bootstrap secret is required to complete setup

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256
        setup_secret:
          type: string
          description: Optional bootstrap secret when APP_SNATCHARR_SETUP_SECRET is configured

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, viewer]

    Session:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time

    SSOStatus:
      type: object
      required: [oidc, proxy]
      properties:
        oidc:
          type: boolean
        proxy:
          type: boolean

    ApiKeyScope:
      type: string
      enum:
        - core:read
        - core:write
        - requests:read
        - requests:write
        - download_clients:read
        - download_clients:write
        - prowlarr:read
        - prowlarr:write
        - notifications:read
        - notifications:write
        - admin:read
        - admin:write
        - adult:read
        - adult:write

    ApiKey:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expires_at:
          type: string
          format: date-time

    AppKind:
      type: string
      enum: [sonarr, radarr, lidarr, readarr, whisparr_v2, whisparr_v3]

    Instance:
      type: object
      required: [id, kind, name, base_url, enabled, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AppKind"
        name:
          type: string
        base_url:
          type: string
          format: uri
        enabled:
          type: boolean
        source:
          type: string
          enum: [manual, configarr, seerr]
        configarr_key:
          type: string
        last_seen_version:
          type: string
        last_seen_product:
          $ref: "#/components/schemas/ArrProduct"
        last_check_at:
          type: string
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InstanceInput:
      type: object
      required: [kind, name, base_url, api_key]
      properties:
        kind:
          $ref: "#/components/schemas/AppKind"
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
        api_key:
          type: string
          minLength: 8
        enabled:
          type: boolean
          default: true

    InstanceUpdate:
      type: object
      required: [kind, name, base_url]
      properties:
        kind:
          $ref: "#/components/schemas/AppKind"
        name:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
        api_key:
          type: string
          description: Omit or leave empty to keep the stored key
        enabled:
          type: boolean
          default: true

    ArrProduct:
      type: string
      description: >-
        The product that answered the probe of an instance kind several products serve. That
        is the kind `readarr` alone: forks of the retired Readarr keep its API layout. The
        probe tells them apart by `appName`, `packageAuthor` and `version` of
        `system/status`. `unknown` is an answer that matches none of the others. An instance
        carries the product of its last successful connection test as `last_seen_product`.
      enum: [readarr, bookshelf, chaptarr, readarr_faustvii, unknown]

    ProbeResult:
      type: object
      required: [app_name, version]
      properties:
        app_name:
          type: string
        version:
          type: string
        product:
          $ref: "#/components/schemas/ArrProduct"

    PolicyFilterOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string

    PolicyFilterOptions:
      type: object
      required: [tags, quality_profiles]
      properties:
        tags:
          type: array
          description: Tags of the instance, sorted by name.
          items:
            $ref: "#/components/schemas/PolicyFilterOption"
        quality_profiles:
          type: array
          description: Quality profiles of the instance, sorted by name.
          items:
            $ref: "#/components/schemas/PolicyFilterOption"

    SnatchPolicy:
      type: object
      required:
        - missing_per_cycle
        - upgrade_per_cycle
        - cycle_interval_s
        - hourly_cap
        - selection
        - monitored_only
        - skip_future_releases
        - radarr_release_type
        - sonarr_missing_mode
        - sonarr_upgrade_mode
        - lidarr_missing_mode
        - processed_ttl_h
        - max_queue_size
        - await_command
        - page_size
        - recent_grab_window_h
        - afterglow_max_h
      properties:
        missing_per_cycle:
          type: integer
          description: "How many missing items one snatch goes after (0 disables missing snatches)."
          minimum: 0
          maximum: 100
        upgrade_per_cycle:
          type: integer
          description: "How many cutoff-unmet items one snatch goes after (0 disables upgrade snatches)."
          minimum: 0
          maximum: 100
        cycle_interval_s:
          type: integer
          description: "Refractory period: seconds between two snatches of the same kind."
          minimum: 60
          maximum: 604800
        hourly_cap:
          type: integer
          description: "Stamina: searches an instance may send to its indexers per hour before it needs a rest (1-500). One per episode, season, movie, album or book; one for a whole artist or author search."
          minimum: 1
          maximum: 500
        selection:
          type: string
          enum: [random, sequential, recent]
          description: "random spreads searches over the library, sequential walks it with a cursor, recent prefers the newest releases with a slice reserved for the backlog"
        monitored_only:
          type: boolean
        skip_future_releases:
          type: boolean
        radarr_release_type:
          type: string
          enum: [physical, digital, cinema]
        sonarr_missing_mode:
          type: string
          enum: [episodes, season_packs, shows]
        sonarr_upgrade_mode:
          type: string
          enum: [episodes, season_packs]
        lidarr_missing_mode:
          type: string
          enum: [artist, album]
        processed_ttl_h:
          type: integer
          description: "Afterglow: hours an item rests after a snatch before it may be touched again."
          minimum: 1
          maximum: 8760
        max_queue_size:
          type: integer
          minimum: -1
          maximum: 100000
        await_command:
          type: boolean
        page_size:
          type: integer
          minimum: 10
          maximum: 1000
        recent_grab_window_h:
          type: integer
          minimum: 0
          maximum: 720
          description: "Skip items the *arr grabbed within this many hours (its history) and items already in its download queue; 0 keeps only the queue check."
        afterglow_max_h:
          type: integer
          minimum: 1
          maximum: 8760
          description: "Afterglow doubles after every fruitless snatch of the same item, up to this many hours."
        include_tags:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
          description: "*arr tag ids: when not empty, only items carrying one of these tags are searched. An episode, album or book has the tags of its series, artist or author. Absent = empty."
        exclude_tags:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
          description: "*arr tag ids: items carrying any of these tags are never searched. An id may not be in both tag lists. Absent = empty."
        include_quality_profiles:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
          description: "*arr quality profile ids: when not empty, only items using one of these profiles are searched. An episode, album or book uses the profile of its series, artist or author; a Chaptarr author counts its audiobook and ebook profiles too. Absent = empty."
        exclude_quality_profiles:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
          description: "*arr quality profile ids: items using any of these profiles are never searched. An id may not be in both profile lists. Absent = empty."
        release_delay_h:
          type: integer
          minimum: 0
          maximum: 8760
          description: "Skip items released less than this many hours ago; 0 (or absent) turns the delay off. The release date is the one of the app kind: air date (Sonarr, Whisparr v2), the date of radarr_release_type (Radarr, Whisparr v3), the album or book release date. Items without a date are kept."
        dry_run:
          type: boolean
          default: false
          description: "When true, planner creates preview / dry-run runs that do not dispatch searches."
        skip_unavailable_movies:
          type: boolean
          default: true
          description: "Radarr only: skip movies Radarr reports as not yet available (isAvailable false, the movie's minimum availability is not reached). They are not searched and cost no stamina. Movies without the flag are searched. Absent = true."
        updated_at:
          type: string
          format: date-time
          readOnly: true

    SnatchKind:
      type: string
      enum: [missing, upgrade]

    RunTrigger:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SnatchKind"

    Run:
      type: object
      required: [id, instance_id, kind, status, queued_at, searched_count]
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/SnatchKind"
        status:
          type: string
          enum: [queued, leased, done, failed, cancelled]
        leased_by:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        searched_count:
          type: integer
        error:
          type: string
        focus_entity_id:
          type: integer
          format: int64
          description: Set for a quickie limited to one movie (Seerr request)
        focus_group_id:
          type: integer
          format: int64
          description: Set for a quickie limited to one series (Seerr request)
        dry_run:
          type: boolean
          readOnly: true
          description: Set when the run is a dry-run / preview
        seed:
          type: integer
          format: int64
          readOnly: true
          description: RNG seed used for the run (0 = OS entropy). A preview seed has at most 53 bits.
        previewed_targets:
          type: array
          readOnly: true
          description: Previewed search targets when dry_run is true
          items:
            $ref: "#/components/schemas/PreviewTarget"

    PreviewResult:
      type: object
      required: [run_id, seed]
      properties:
        run_id:
          type: string
          format: uuid
        seed:
          type: integer
          format: int64

    PreviewTarget:
      type: object
      required: [entity_type, id, title, cost]
      properties:
        entity_type:
          type: string
        id:
          type: integer
          format: int64
        title:
          type: string
        cost:
          type: integer
          description: Stamina this item adds to the run. An atomic search (season pack, series, artist, author) is charged on its first item and 0 on the rest, so the costs sum to what a real run spends.

    Event:
      type: object
      required: [id, instance_id, ts, level, type]
      properties:
        id:
          type: integer
          format: int64
        run_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        type:
          type: string
        entity_type:
          type: string
        entity_id:
          type: integer
          format: int64
        title:
          type: string
        detail:
          type: string

    CapStatus:
      type: object
      required: [scope, used, cap, resets_at]
      properties:
        scope:
          type: string
          enum: [instance, global]
          description: "global is the stamina shared by every instance (present only when configured)"
        instance_id:
          type: string
          format: uuid
          description: Absent for the global entry
        used:
          type: integer
          description: Items granted within the rolling 60-minute window, the same sum the grant enforces
        cap:
          type: integer
        resets_at:
          type: string
          format: date-time
          description: When stamina next frees up (the oldest spend still counted leaves the window); now when nothing is spent

    LogLevel:
      type: string
      enum: [debug, info, warn, error]
    LogAttr:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: Attribute key; group names are joined with dots.
        value:
          type: string
    LogRecord:
      type: object
      required: [seq, time, level, source, message, attrs]
      properties:
        seq:
          type: integer
          format: int64
          description: Position in the ring since process start; increases by one per record.
        time:
          type: string
          format: date-time
        level:
          $ref: "#/components/schemas/LogLevel"
        source:
          type: string
          description: "Process that emitted the record: api, or worker:<id> for a worker."
        message:
          type: string
        attrs:
          type: array
          items:
            $ref: "#/components/schemas/LogAttr"
    LogPage:
      type: object
      required: [records, capacity, dropped]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/LogRecord"
        capacity:
          type: integer
          description: Number of records the ring holds.
        dropped:
          type: integer
          format: int64
          description: Records overwritten since process start because the ring was full.
    PriorityPresetMap:
      type: object
      description: Priority rank (1..100, lower goes first) per *arr application kind.
      additionalProperties:
        type: integer
        minimum: 1
        maximum: 100

    PriorityPreset:
      type: object
      required: [name, search, download]
      properties:
        name:
          type: string
          description: Identifier of the shipped preset (e.g. media_first).
        search:
          $ref: "#/components/schemas/PriorityPresetMap"
        download:
          $ref: "#/components/schemas/PriorityPresetMap"

    PrioritySource:
      type: string
      enum: [preset, instance]

    InstancePriorityInput:
      type: object
      properties:
        search_priority:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Optional per-instance search priority rank override (1..100, lower goes first; null clears override).
        download_priority:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Optional per-instance download priority rank override (1..100, lower goes first; null clears override).

    InstancePriority:
      type: object
      required:
        - search_priority
        - download_priority
        - effective_search_priority
        - effective_download_priority
        - search_source
        - download_source
      properties:
        search_priority:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        download_priority:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
        effective_search_priority:
          type: integer
          minimum: 1
          maximum: 100
        effective_download_priority:
          type: integer
          minimum: 1
          maximum: 100
        search_source:
          $ref: "#/components/schemas/PrioritySource"
        download_source:
          $ref: "#/components/schemas/PrioritySource"

    Settings:
      type: object
      required:
        - history_retention_days
        - user_agent
        - global_hourly_cap
        - search_priority_preset
        - download_priority_preset
      properties:
        history_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        user_agent:
          type: string
          minLength: 1
          maxLength: 200
        global_hourly_cap:
          type: integer
          minimum: 0
          maximum: 5000
          description: "Shared stamina across every instance for setups where several *arr apps hit the same indexers (0 = off)."
        search_priority_preset:
          $ref: "#/components/schemas/PriorityPresetMap"
        download_priority_preset:
          $ref: "#/components/schemas/PriorityPresetMap"
        llm_enabled:
          type: boolean
          default: false
          description: "Whether the Model Context Protocol (MCP) server at /api/v1/mcp is enabled."
        updated_at:
          type: string
          format: date-time

    StateReset:
      type: object
      properties:
        instance_id:
          type: string
          format: uuid

    StateResetResult:
      type: object
      required: [forgotten]
      properties:
        forgotten:
          type: integer
          format: int64

    ScheduleInput:
      type: object
      required: [name, days, start, end, tz, action, enabled]
      properties:
        instance_id:
          type: string
          format: uuid
          description: Omit for a global window
        name:
          type: string
          minLength: 1
          maxLength: 64
        days:
          type: array
          description: Weekdays the window applies to (0 = Sunday)
          minItems: 1
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        tz:
          type: string
          minLength: 1
        action:
          type: string
          enum: [pause, cap_override]
        cap_value:
          type: integer
          minimum: 1
          maximum: 500
        enabled:
          type: boolean

    Schedule:
      allOf:
        - $ref: "#/components/schemas/ScheduleInput"
        - type: object
          required: [id, created_at, updated_at, active]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            active:
              type: boolean
              description: Whether this schedule window matches the current evaluation time.

