openapi: 3.1.0
info:
  title: SnatchArr API
  version: 0.1.0
  description: |
    Control-plane API for SnatchArr. Every non-2xx response is an RFC 9457 problem
    (`application/problem+json`). Browser clients authenticate with the `snatcharr_session`
    cookie plus an `X-CSRF-Token` header on unsafe methods; automation uses an API key
    as a Bearer token.
  license:
    name: EUPL-1.2
    identifier: EUPL-1.2
servers:
  - url: /api/v1
tags:
  - name: system
    description: Service status
  - name: auth
    description: Setup, login and sessions
  - name: instances
    description: "*arr instances and their snatch policies"
  - name: snatches
    description: Runs, history, hourly caps and processed memory
  - name: schedules
    description: Pause and cap-override windows
  - name: download-clients
    description: Torrent and Usenet clients observed for backpressure (never driven)
  - name: seerr
    description: Seerr requests snatched first (read-only; nothing is written to Seerr)
  - name: prowlarr
    description: Prowlarr indexer stamina and limits (read-only; nothing is written to Prowlarr)
  - name: configarr
    description: Instances imported from a Configarr config.yml (ADR-0003)
  - name: notifications
    description: Channels and rules for dispatching failure, circuit, stamina and Seerr notifications
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Service status and build information
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          $ref: "#/components/responses/Problem"

  /auth/setup/status:
    get:
      tags: [auth]
      operationId: getSetupStatus
      summary: Whether the first user still has to be created
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"

  /auth/setup:
    post:
      tags: [auth]
      operationId: completeSetup
      summary: Create the first admin user and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: User created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the current user's password and end all other sessions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions ended
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Problem"

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session, user and CSRF token
      responses:
        "200":
          description: Session
          headers:
            X-CSRF-Token:
              description: Token to echo on unsafe requests
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /auth/sso:
    get:
      tags: [auth]
      operationId: getSSO
      summary: SSO configuration status
      security: []
      responses:
        "200":
          description: SSO status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStatus"
        default:
          $ref: "#/components/responses/Problem"

  /auth/proxy-session:
    post:
      tags: [auth]
      operationId: createProxySession
      summary: Start a session via trusted proxy authentication
      security: []
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/api-keys:
    get:
      tags: [auth]
      operationId: listAPIKeys
      summary: List the current user's active API keys
      security:
        - cookieAuth: []
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [auth]
      operationId: createAPIKey
      summary: Create a new API key for the current user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      tags: [auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      security:
        - cookieAuth: []
      responses:
        "204":
          description: API key revoked
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /instances:
    get:
      tags: [instances]
      operationId: listInstances
      summary: List instances (API keys are never returned)
      responses:
        "200":
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [instances]
      operationId: createInstance
      summary: Add a manual instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"

  /instances/test:
    post:
      tags: [instances]
      operationId: testInstanceInput
      summary: Probe credentials that are not stored yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceInput"
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getInstance
      summary: Get one instance
      responses:
        "200":
          description: Instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [instances]
      operationId: updateInstance
      summary: Update a manual instance (omit api_key to keep it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [instances]
      operationId: deleteInstance
      summary: Delete an instance and everything it owns
      description: An instance that the Configarr configuration still declares cannot be deleted (403); one that was removed from it can.
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/test:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [instances]
      operationId: testInstance
      summary: Probe a stored instance and record the outcome
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/policy:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getPolicy
      summary: Snatch policy of an instance
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnatchPolicy"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [instances]
      operationId: updatePolicy
      summary: Replace the snatch policy of an instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnatchPolicy"
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnatchPolicy"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/priority:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getInstancePriority
      summary: Search and download priority overrides and effective ranks of an instance
      responses:
        "200":
          description: Instance priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePriority"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [instances]
      operationId: updateInstancePriority
      summary: Replace the search and download priority overrides of an instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstancePriorityInput"
      responses:
        "200":
          description: Instance priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePriority"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/policy/filter-options:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getPolicyFilterOptions
      summary: Tags and quality profiles the instance offers for the policy filters
      description: |
        Reads the tags and quality profiles from the *arr instance itself, so the policy form
        can offer them by name. Nothing is stored; an unreachable instance answers 502.
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyFilterOptions"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/queue-policy:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: getQueuePolicy
      summary: Queue management policy of an instance
      responses:
        "200":
          description: Queue policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuePolicy"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [instances]
      operationId: updateQueuePolicy
      summary: Replace the queue management policy of an instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueuePolicy"
      responses:
        "200":
          description: Queue policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuePolicy"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/queue-strikes:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      operationId: listQueueStrikes
      summary: Active queue strikes of an instance
      description: Items with at least one strike; items the last sweep found clean are left out.
      responses:
        "200":
          description: Queue strikes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueStrike"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/runs:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [snatches]
      operationId: triggerRun
      summary: Quickie - queue a snatch now (ignores the refractory period)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      responses:
        "201":
          description: Run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: A run for this kind is already queued or leased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/preview:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [snatches]
      operationId: previewRun
      summary: Start a dry-run / preview snatch run
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            description: "Snatch kind: missing or upgrade"
      responses:
        "202":
          description: Preview run enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResult"
        default:
          $ref: "#/components/responses/Problem"

  /instances/{instanceId}/events:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    delete:
      tags: [snatches]
      operationId: deleteInstanceEvents
      summary: Clear the history of one instance
      responses:
        "204":
          description: Cleared
        default:
          $ref: "#/components/responses/Problem"

  /runs:
    get:
      tags: [snatches]
      operationId: listRuns
      summary: Recent snatch runs, newest first
      parameters:
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}:
    get:
      tags: [snatches]
      operationId: getRun
      summary: Load a single snatch run by ID
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Problem"

  /runs/{runId}/cancel:
    post:
      tags: [snatches]
      operationId: cancelRun
      summary: Cancel a queued or leased run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cancelled
        default:
          $ref: "#/components/responses/Problem"

  /events:
    get:
      tags: [snatches]
      operationId: listEvents
      summary: Snatch history, newest first (cursor on before_id)
      parameters:
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - name: before_id
          in: query
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        default:
          $ref: "#/components/responses/Problem"

  /settings:
    get:
      tags: [system]
      operationId: getSettings
      summary: Runtime settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [system]
      operationId: updateSettings
      summary: Replace the runtime settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

  /priority-presets:
    get:
      tags: [system]
      operationId: getPriorityPresets
      summary: Shipped search and download priority presets
      responses:
        "200":
          description: Shipped priority presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriorityPreset"
        default:
          $ref: "#/components/responses/Problem"

  /logs:
    get:
      tags: [system]
      operationId: listLogs
      summary: Recent log records of this api process and its workers, newest first (admin only)
      description: >-
        Records come from a fixed-size in-memory ring (snatcharr.logs.ring_size). Secret
        attributes, credential query parameters, bearer tokens, URL userinfo and 32-character
        hex keys are replaced with [REDACTED] before a record is stored. The live tail is the
        Server-Sent Events stream at /api/v1/logs/stream (default event type message, same record
        shape), outside this router.
      parameters:
        - name: level
          in: query
          description: Minimum level; records below it are left out.
          schema:
            $ref: "#/components/schemas/LogLevel"
        - name: q
          in: query
          description: Case-insensitive substring of the message, an attribute key or value.
          schema:
            type: string
            maxLength: 200
        - name: source
          in: query
          description: "Source: api, worker for every worker, or worker:<id> for one worker."
          schema:
            type: string
            maxLength: 160
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Log records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogPage"
        default:
          $ref: "#/components/responses/Problem"

  /hourly-caps:
    get:
      tags: [snatches]
      operationId: getHourlyCaps
      summary: Per-instance stamina spent in the last 60 minutes (rolling window)
      responses:
        "200":
          description: Caps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapStatus"
        default:
          $ref: "#/components/responses/Problem"

  /state/reset:
    post:
      tags: [snatches]
      operationId: resetState
      summary: Forget processed items (one instance or all)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateReset"
      responses:
        "200":
          description: Rows forgotten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResetResult"
        default:
          $ref: "#/components/responses/Problem"

  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: All schedule windows
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Add a schedule window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"

  /schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [schedules]
      operationId: updateSchedule
      summary: Replace a schedule window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a schedule window
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /download-clients:
    get:
      tags: [download-clients]
      operationId: listDownloadClients
      summary: List download clients (secrets are never returned)
      responses:
        "200":
          description: Download clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [download-clients]
      operationId: createDownloadClient
      summary: Add a download client by hand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClient"
        default:
          $ref: "#/components/responses/Problem"

  /download-clients/test:
    post:
      tags: [download-clients]
      operationId: testDownloadClientInput
      summary: Observe a download client whose credentials are not stored yet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadClientInput"
      responses:
        "200":
          description: Observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientStatus"
        default:
          $ref: "#/components/responses/Problem"

  /download-clients/status:
    get:
      tags: [download-clients]
      operationId: getDownloadClientStatus
      summary: Latest observation of every enabled download client (cached 20 s)
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadClientStatus"
        default:
          $ref: "#/components/responses/Problem"

